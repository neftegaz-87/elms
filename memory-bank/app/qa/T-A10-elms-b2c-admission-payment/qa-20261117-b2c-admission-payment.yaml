test_plan:
  catalog: .cursor/templates/qa/test-catalog.yaml
  source: [implement_shards, plan_contract, diff, prior_blockers]
  mode: diff_aware
  scope_signals: [backend, frontend, browser, api, wire, auth, roles, data, external_integration, async, security, accessibility, responsive, reliability, observability, content_i18n, brownfield, compatibility]
  selected:
    - id: contract_acceptance
      name: Contract and acceptance criteria tests
      reason: FR-001..FR-004, NFR-001..NFR-004, US-001..US-005 and AC-001..AC-006 are in the completed three-shard contract.
      evidence: coverage_map plus backend and wire lanes
    - id: regression
      name: Changed behavior and prior-defect regression tests
      reason: The diff replaces free B2C enrollment with the payment gate and changes shared learning/admission UI call sites.
      evidence: backend lane admission, learning UI, and enrollment regression commands
    - id: backend_unit_component
      name: Backend unit and component tests
      reason: Profile validation, payment orchestration, webhook parsing, and enrollment enforcement are backend logic.
      evidence: backend lane exact shard pytest commands
    - id: backend_integration_state
      name: Backend integration and state tests
      reason: Admission Profile, Payment, private File attachments, Enrollment, and Progress persistence/state are in scope.
      evidence: backend lane persistence and state assertions
    - id: api_contract
      name: API contract, schema, status, and error tests
      reason: save_profile, create_payment, payment_webhook, and enrollment APIs are explicit machine contracts.
      evidence: backend API tests and wire journey HTTP responses
    - id: data_persistence_migration
      name: Data persistence, migration, idempotency, and rollback tests
      reason: DocTypes, one-profile uniqueness, payment event idempotency, and one-enrollment state are in scope.
      evidence: backend state tests and idempotent webhook assertions
    - id: frontend_build_assets
      name: Frontend build, type, lint, and asset delivery tests
      reason: Desk admission/learning JavaScript, CSS, page registration, and hooks are changed.
      evidence: frontend_build syntax/compile/asset scans
    - id: browser_functional
      name: Browser functional user-flow tests
      reason: The admission profile → upload → pay waiting/success journey is user-visible.
      evidence: typed browser/wire runtime artifact
    - id: wire_journey
      name: Real UI-to-API wire journey tests
      reason: The required path crosses Desk UI, save_profile/create_payment/payment_webhook and learner enrollment.
      evidence: typed authenticated runtime browser/API artifact
    - id: live_http_smoke
      name: Live HTTP smoke tests
      reason: The app and Keycloak-backed Desk runtime are required for browser and API acceptance.
      evidence: live_smoke typed HTTP artifact
    - id: negative_error_paths
      name: Negative, validation, denial, timeout, and recovery tests
      reason: Incomplete profile, unsigned/failed webhook, missing provider, and unpaid enrollment are explicit denies.
      evidence: admission negative-path tests and runtime error observations
    - id: auth_session_rbac
      name: Authentication, session, authorization, and role tests
      reason: Learner self-access, Admin/Operations read access, foreign/Guest denial, and private files are in scope.
      evidence: profile ACL tests and authenticated browser session
    - id: async_jobs_workers_webhooks
      name: Async job, worker, queue, retry, and webhook tests
      reason: Signed inbound webhook delivery and duplicate event handling are explicit contract behavior.
      evidence: webhook signature/idempotency tests and wire HTTP webhook response
    - id: security_owasp
      name: Security and OWASP spot-check tests
      reason: Authentication, authorization, signatures, secrets, external input, private PII files, and masked logs are in scope.
      evidence: security review, ACL/signature tests, and scoped source scans
    - id: accessibility
      name: Accessibility and keyboard interaction tests
      reason: Admission form controls, file inputs, consent, error, and waiting states are user-visible.
      evidence: browser journey keyboard/accessible-state checks
    - id: responsive_compatibility
      name: Responsive, viewport, browser, and compatibility tests
      reason: The Desk admission surface must render at the declared desktop and narrow supported viewport checks.
      evidence: browser journey viewport captures
    - id: visual_states
      name: Visual states, layout, styling, and asset-cascade tests
      reason: Profile, upload, pay, waiting, error, and success states have changed CSS/UI acceptance.
      evidence: browser journey state and computed-style capture
    - id: console_network
      name: Browser console, network, and client-error tests
      reason: The browser path must use real API calls without console errors or hidden client-side mocks.
      evidence: browser network/console capture
    - id: observability
      name: Logging, metrics, tracing, and failure-observability tests
      reason: NFR-003 requires PII masking and webhook failures must be observable without leaking sensitive values.
      evidence: PII-mask tests and runtime error capture
    - id: content_i18n
      name: Content, localization, formatting, and empty-state tests
      reason: Admission copy, validation/error/waiting/success states, and empty batch state are user-facing contracts.
      evidence: UI contract tests and browser state capture
    - id: cleanup_sot
      name: Legacy, fallback, duplicate-owner, and source-of-truth cleanup tests
      reason: s03 explicitly purges free enroll_self, local paid flags, and instruction/fallback leftovers.
      evidence: leftover_sot lane exact negative scans
  not_applicable:
    - id: external_integration
      name: Real external integration and provider tests
      reason: The concrete payment vendor adapter is a non-goal; the port/fake and signed webhook contract are covered by selected backend/API/webhook tests.
    - id: performance_resilience
      name: Performance, timeout, retry, load, and resilience tests
      reason: No performance/load SLO or retry worker is part of this narrow B2C slice; fail-closed and idempotency are covered by selected negative and webhook obligations.
  not_run:
    - id: exploratory
      name: Exploratory edge-case and usability tests
      reason: Optional lane; the required deterministic browser journey and contract tests cover the declared acceptance surface.
      next_action: Run a time-boxed manual learner usability pass with a seeded account in the next QA cycle.

