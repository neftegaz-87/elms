  - 'LearnerProfile crosses save_profile as validated JSON/Pydantic DTO.'
  - 'PaymentStatus and PaymentEvent come from validated webhook JSON, not UI prose.'
  - 'Active B2C Enrollment is server-created only after a paid payment_id link.'
  - 'ELMS Admission Profile remains distinct from the ELMS Learner Profile Role Profile.'
