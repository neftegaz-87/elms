ac_plus:
  - 'AC-001: Incomplete profile rejects create_payment with typed error.'
  - 'AC-002: Complete profile/files/consent creates pending Payment/provider session.'
  - 'AC-003: Valid signed paid webhook creates exactly one Active Enrollment.'
  - 'AC-004: Failed or unsigned webhook creates no Active Enrollment.'
  - 'AC-005: B2C enroll_learner/enroll_self without paid payment is denied.'
  - 'AC-006: Incomplete profile/files/consent fails validation; complete save persists one private Admission Profile per User.'
ac_minus:
  - 'No catalog or server path silently performs free B2C enrollment.'
  - 'No local/free-text/manual paid override is an enrollment source of truth.'
  - 'Missing payment provider fails closed instead of creating a free enrollment.'
  - 'Admission scans are private and PII is not emitted in cleartext logs.'
