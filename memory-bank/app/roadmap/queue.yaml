batches:
  elms-auth-surface:
    title: ELMS Keycloak login surface and brokered SSO journey
    note: Один APP slice владеет стандартной Frappe login-кнопкой, env/Docker wiring,
      Keycloak realm/Yandex broker, callback journey и mixed QA.
  elms-learning-core:
    title: ELMS Core Learning Flows & State Compliance
    note: Полный вертикальный срез учебного контура (LMS) - потоки (Batch), подписки
      (Subscription), зачисления (Enrollment), прогресс курса и уроков (Progress),
      трекинг активности (Activity, Video Log), обновление навигации Workspace LMS
      в Desk и стыковка с требованиями РФ (ФИС ФРДО, ПП 2464, 152-ФЗ).
  elms-learner-progress:
    title: Прогресс слушателя и прохождение тестов в LMS
    note: >-
      Один mixed APP-срез: варианты ответа и возобновляемые quiz attempts для
      слушателя плюс role/DocPerm-controlled просмотр прогресса и истории выбранного
      слушателя по программам, курсам, урокам, действиям и календарным годам.
  elms-knowledge-assistant:
    title: Ассистент знаний ELMS и настройки интеграций
    note: Отдельное окно ELMS Integration Settings (Base URL + API Key для любого
      OpenAI-compatible провайдера, включая OmniRoute), grounded Desk-чат у поиска по
      связям, optional/fail-closed без RAG и без hard-dep в prod.
  elms-b2b-access:
    title: B2B доступ, заявки и кабинет администратора компании
    note: Keycloak/org provisioning, Bitrix application status and company admin cabinet.
