done:
  - "Canonical XLSX headers and rows are grounded through OmniRoute and validated by typed AdmissionHeader/AdmissionRow DTOs before persistence."
  - "Organization-scoped ELMS Admission Import parent/rows persist draft, parsed, or failed outcomes with file-hash idempotency and explicit revisions."
  - "Missing-email rows receive deterministic synthetic login/email records with protected one-time invite_token reveal audit; no learner secret is in preview."
  - "Company Admin Desk upload, preview, row errors, export, and credential reveal are wired to whitelisted APIs."

integration_check:
  - "Company Admin upload is organization-scoped and same-file retries return the existing revision unless new_revision is explicit."
  - "OmniRoute structured JSON is validated before a row becomes parsed; corrupt files, provider failures, and row errors remain explicit failed outcomes."
  - "Preview and export expose structured rows only, while invite-token reveal is explicit, authorized, and one-time."
  - "The import boundary contains no forbidden downstream enrollment call or document creation path."

wire_complete:
  call_sites:
    - Company Admin admission page -> upload_import -> organization/file-hash authorization
    - upload_import -> existing OmniRoute client -> structured JSON -> AdmissionHeader/AdmissionRow validation
    - validated DTOs -> ELMS Admission Import + child rows -> parsed preview; failures -> failed status and row errors
    - missing email -> deterministic synthetic identity -> protected invite_token -> one-time reveal audit
    - parsed rows -> export_import -> structured handoff artifact only
  enforce_path: elms/elms/admission/import_api.py
  dual_path_rg: "! rg -n 'Enrollment|enroll_' elms/elms/admission/import_api.py elms/elms/admission/import_service.py elms/elms/admission/credentials.py"
  instruction_rg: "rg -n 'silent|без email|synthetic|credential|invite-token|invite_token|preview|export' elms/elms/admission/import_api.py elms/elms/admission/import_service.py elms/elms/public/js/desk-admission.js"
  deny_old_proven: true

