done:
  - "Individual and legal Pydantic payloads enforce consent, email, INN, published-course selection and honeypot validation."
  - "crm.lead.add is the only Bitrix create path and returns a validated Lead id before ELMS persists the Application Link."
  - "Application Link stores bitrix_id, lead entity, application kind, applicant snapshot, courses, consent timestamp and idempotency fingerprint."
  - "Public /apply and /apply/legal forms call the real submit_application whitelist method and show a tracking ref only after persistence."
  - "Missing BITRIX_REST_WEBHOOK_URL and Bitrix transport errors fail closed without a local success response."

