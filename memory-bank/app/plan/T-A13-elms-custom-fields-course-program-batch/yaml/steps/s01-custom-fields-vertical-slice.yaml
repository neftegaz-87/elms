split:
  independent_outcomes:
    - A manager can define, save, and read a typed field on a permitted target form.
    - The same server boundary rejects invalid values and foreign organization access.
  split_seams: []
  rationale: >-
    These are coupled acceptance properties of one schema/value boundary. A separate
    backend, UI, or integration shard would permit an unvalidated or unscoped path
    to ship and would duplicate the custom-field source of truth.
