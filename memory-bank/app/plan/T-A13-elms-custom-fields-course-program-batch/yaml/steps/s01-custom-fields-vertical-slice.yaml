    fastapi-templates: Frappe whitelist and Document APIs are the backend boundary; no FastAPI route or dependency-injection surface.
    async-python-patterns: Frappe document saves and Desk calls are synchronous; no async I/O, concurrent handler, or websocket task exists.
    sqlalchemy-postgres: Persistence uses Frappe DocTypes and JSON fields, not SQLAlchemy or Alembic.
    supabase-postgres-best-practices: No Supabase or direct SQL persistence is introduced.
    websocket-engineer: Schema/value operations are request/response and do not require realtime fanout.
    python-performance-optimization: No measured hot path, streaming, or downsampling requirement exists for the MVP.
    python-configuration: No new environment, settings, or deployment configuration surface is introduced.
    python-observability: Existing Frappe errors are sufficient; this slice adds no new metrics, health, or logging subsystem.
    python-resilience: No external provider, retry, timeout, or circuit-breaker boundary is introduced.
    playwright-generate-test: Browser acceptance uses the existing ELMS harness; this slice does not add a new Playwright spec generator path.
    vercel-react-view-transitions: The UI is an existing Frappe Desk page/form surface and does not use View Transitions API.
    full-output-enforcement: Acceptance needs focused schema/value controls, not a full unabridged UI dump.
    ui-ux-pro-max: This is an existing product UI extension using the ELMS/neftegaz visual canon, not a new style encyclopedia.
