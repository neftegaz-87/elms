  roles:
    definition_write: ELMS Company Admin or ELMS Methodologist for an organization they belong to; ELMS Admin/System Manager only for the platform owner organization.
    definition_read: The same organization-scoped manager roles; no foreign-organization read.
    target_write: The existing target DocType permission plus the same organization scope.
    denied: Guest, ELMS Learner, unrelated users, foreign organization context, and all Category/Chapter/Lesson targets.
  persistence: >-
    ELMS Custom Field Definition is the schema SoT. Course, Program, and Batch each
    store one versioned custom_field_values JSON object; no parallel long-text or
    shadow table stores custom values. Definitions are scoped by organization and
    applies_to. Values use stable field_key keys and are validated before insert/save.
  inheritance: >-
    Effective values merge Program defaults, then Course values, then Batch values
    for the linked course. Missing or empty text/date/select values inherit; numeric
    zero and checkbox false are explicit values. A Batch never writes back into its
    Course or Program. The response exposes stored and effective values separately.
  validation: >-
    text is a string, number is numeric but not boolean, date is ISO YYYY-MM-DD,
    select is one of the definition options, and checkbox is boolean. Required
    fields reject missing/empty values. Unknown keys, malformed JSON, unsupported
    target types, incompatible schema_version, and foreign organization access raise
    typed Frappe errors before persistence.
  api:
    methods:
      - elms.lms.api.custom_fields.get_custom_field_schema
      - elms.lms.api.custom_fields.save_custom_field_definition
      - elms.lms.api.custom_fields.delete_custom_field_definition
      - elms.lms.api.custom_fields.get_custom_field_form_data
    input: JSON definition/value payloads with target doctype/name and organization context.
    output: Definitions, stored values, effective values, schema_version, and typed validation errors.
    deny: Target allowlist is exactly ELMS Course, ELMS Program, and ELMS Batch; unsupported learning-graph targets return 404 or ValidationError and have no UI route.
  ui_contract:
    route: /app/elms-custom-fields
    form_targets: ELMS Course, ELMS Program, ELMS Batch
    required: Schema manager CRUD, target selector, field type/options editor, Additional fields section, saved value readback, validation error, keyboard-visible controls.
    layout: Compact existing ELMS Desk form/page surface with scoped controls, labels, focus state, and no new SPA shell.
  done: >-
    A permitted manager defines a Course select field, saves a valid value from the
    Course form, reloads the form and sees it; invalid values fail with
    ValidationError; a foreign organization cannot read or write the definition or
    target value; inheritance is deterministic; and no Chapter/Lesson custom-field
    endpoint or MVP UI entry exists.

requirements:
  - Definition keys are stable per organization and target; label, type, required, options, active state, and schema_version are persisted.
  - MVP field types are text, number, date, select, and checkbox only; select definitions require a non-empty option list.
  - Course, Program, and Batch each expose one versioned JSON value payload under an Additional fields section.
  - Every insert/save path invokes the same server validator; client-side controls never become the security or type authority.
  - The schema manager and form API use the existing organization access helper and fail closed for a foreign organization.
  - Program values are defaults for linked Course and Batch values; Course overrides Program and Batch overrides Course.
  - Empty override values inherit while explicit zero/false remain valid; effective values are returned without mutating parent documents.
  - Category/Chapter/Lesson are absent from the target allowlist, page, form hooks, and workspace custom-field entry points.
  - Schema/value version markers are retained and incompatible payloads fail closed instead of being silently coerced.

