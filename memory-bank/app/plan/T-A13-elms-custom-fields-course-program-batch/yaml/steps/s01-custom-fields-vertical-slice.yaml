  - RED: Add validation tests proving invalid number/date/select/checkbox values, unknown keys, missing required values, and incompatible versions never persist.
  - RED: Add organization tests for Company Admin/Methodologist own-org access and foreign-org read/write denial, including target values.
  - RED: Add inheritance tests for Program default, Course override, Batch override, empty inheritance, numeric zero, and checkbox false.
  - RED: Add UI contract tests for the role-gated schema page, target form hooks, Additional fields label, workspace route, and no Chapter/Lesson entry.
  - GREEN: Implement the common validation/scope/inheritance service, definition DocType, target JSON fields, and controller validate hooks.
  - GREEN: Implement the whitelist schema/form endpoints and bind the schema manager and target forms to the same server contract.
  - REFACTOR: Keep custom values as one versioned JSON SoT and keep client rendering free of authorization or validation authority.

