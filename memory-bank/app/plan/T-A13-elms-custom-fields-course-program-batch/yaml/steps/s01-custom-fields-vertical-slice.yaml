goal: >-
  Дать ELMS методисту или администратору компании единый org-scoped путь: создать
  версионное определение поля для Course, Program или Batch, увидеть контрол на
  соответствующей Desk-форме, сохранить типизированное JSON-значение и получить
  эффективные значения с тонким наследованием Program → Course → Batch.

delta:
  - Add ELMS Custom Field Definition with a stable key, label, allowlisted type, options, target, organization, active flag, and schema version.
  - Add the sole typed custom_field_values JSON payload and schema-version marker to ELMS Course, ELMS Program, and ELMS Batch.
  - Add one server validation/scope service and whitelist schema/form APIs; reject unknown types, keys, malformed values, incompatible versions, and foreign organizations.
  - Add the schema manager page, Additional fields controls on all three target forms, scoped product styling, and an LMS workspace entry point.
  - Prove select save/read, invalid-type rejection, organization isolation, inheritance, and the explicit Category/Chapter/Lesson MVP boundary.

as_built:
  - ELMS Course, ELMS Program, and ELMS Batch already have organization ownership and separate fixed DocType fields.
  - LMS API and access helpers already provide Frappe whitelist/Document patterns and organization membership checks.
  - Desk LMS workspace and target forms exist, but no custom-field schema/value contract or manager surface exists.

out_of_scope:
  - Category, Chapter, Lesson, lesson material, or full learning-graph custom schemas.
  - Admission forms, Learner Profile fields, AI/XLSX parse, payment, 1C, Bitrix, or external integrations.
  - File, rich-text, formula, relation, multi-select, or arbitrary executable field types.
  - React/Next SPA, template fork, or a new visual language; use the existing ELMS/neftegaz product UI canon.
  - A separate integration queue or a second value store for the same Course/Program/Batch field.

