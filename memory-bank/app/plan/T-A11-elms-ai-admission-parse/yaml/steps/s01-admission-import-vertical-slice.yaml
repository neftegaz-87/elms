as_built:
  - Existing B2C admission profile/payment code must remain a separate path and is not an import DTO or Enrollment side effect.
  - Existing OmniRoute client is reused as transport; this shard adds the grounded structured-parse contract, not a second provider configuration.
  - Existing Desk admission route is the surface; no parallel FastAPI or foreign CRM/Bitrix import path is introduced.
  - Invite-token provisioning is the concrete credential contract: deterministic synthetic login/email plus protected one-time invite_token; no Frappe User is created in this epic.
  - T-A12 owns quota checks and Enrollment creation after this shard's structured rows are accepted.

delta:
  - Add versioned fixture schema and typed AdmissionHeader/AdmissionRow validation before persistence.
  - Add organization-scoped import parent/child DocTypes with draft/parsed/failed status, hash idempotency, row errors, preview, and export.
  - Add invite-token provisioning with deterministic synthetic identity/login/email, protected one-time invite_token, reveal audit, and no Frappe User creation.
  - Wire Company Admin Desk upload/preview/error/export/reveal to whitelist APIs and prove no Enrollment path.

