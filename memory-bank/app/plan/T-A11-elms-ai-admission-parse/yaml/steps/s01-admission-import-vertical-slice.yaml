wire_complete:
  call_sites:
    - Company Admin admission page -> upload_import -> organization/file-hash authorization
    - upload_import -> existing OmniRoute client -> structured JSON -> AdmissionHeader/AdmissionRow DTO validation
    - validated DTOs -> ELMS Admission Import + child rows -> parsed preview; any failure -> failed status with row/file errors
    - missing email -> deterministic synthetic identity/credential generator -> ELMS Admission Credential login/email + protected invite_token field -> one-time reveal audit; no Frappe User
    - parsed rows -> export_import -> structured handoff artifact only; no Enrollment call
  enforce_path: elms/elms/admission/import_api.py
  dual_path_rg: "! rg -n 'Enrollment|enroll_' elms/elms/admission/import_api.py elms/elms/admission/import_service.py elms/elms/admission/credentials.py"
  instruction_rg: 'rg -n ''silent|без email|synthetic|credential|invite-token|invite_token|no Frappe User|export|preview'' elms/elms/admission/import_api.py elms/elms/admission/import_service.py elms/elms/public/js/desk-admission.js'
  deny_old_proven: true
