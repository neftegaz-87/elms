goal: >-
  Дать Company Admin своей организации единственный ship-ready путь: загрузить
  канонический XLSX, получить bounded AI structured JSON, провалидировать каждую
  строку Pydantic DTO, сохранить draft/parsed/failed import с preview и ошибками,
  создать для строк без email синтетическую identity/credential запись с
  детерминированными login/email и защищённым одноразовым invite_token через
  vault, без создания Frappe User в этом эпике, и экспортировать проверенные
  rows; Enrollment и quota остаются вне эпика.

plan_contract:
  fr_ids: [FR-001, FR-002, FR-003]
  us_ids: [US-001, US-002, US-003, US-004]
  ac_ids: [AC-001, AC-002, AC-003, AC-004]
  nouns:
    - ELMS Admission Import
    - ELMS Admission Import Row
    - ELMS Admission Credential
    - schema_version
    - import status draft/parsed/failed
    - AdmissionHeader and AdmissionRow Pydantic DTOs
    - file hash and explicit revision
    - OmniRoute grounded parse
    - row-level validation errors
    - synthetic login/email and one-time secret reveal
    - invite-token provisioning with protected one-time invite_token
    - no Frappe User creation in this epic
    - Company Admin preview and export
    - T-A12 structured-row handoff
  layout_paths:
    - elms/elms/admission/import_schemas.py
    - elms/elms/admission/import_service.py
    - elms/elms/admission/import_api.py
    - elms/elms/admission/credentials.py
    - elms/elms/operations/doctype/elms_admission_import/
    - elms/elms/operations/doctype/elms_admission_import_row/
    - elms/elms/operations/doctype/elms_admission_credential/
    - elms/elms/operations/page/elms_admission/
    - elms/elms/public/js/desk-admission.js
    - elms/elms/public/css/desk-admission.css
    - elms/elms/tests/test_admission_import.py
    - elms/elms/tests/test_admission_import_ui.py
  plan_jumps:
    - memory-bank/app/plan/T-A11-elms-ai-admission-parse/md/plan.md:1-71
    - memory-bank/app/plan/T-A11-elms-ai-admission-parse/md/plan.md:72-121
  ac_quotes:
    - 'AC-001: Given blank-zayavka fixture; When parse; Then ≥ header fields mapped; sample Сметанин row extracts FIO+SNILS.'
    - 'AC-002: Given row without email; When parse OK; Then synthetic identity created and listed for admin.'
    - 'AC-003: Given corrupt file; When parse; Then import status failed with explicit error; no partial silent success presented as OK.'
    - 'AC-004: Given parsed import; When inspect; Then zero Enrollment documents created by this epic APIs.'
  user_journey: >-
    Company Admin opens the admission import surface for the current organization,
    uploads blank-zayavka-2026.xlsx, sees draft/parsed progress and a row preview,
    corrects or exports only validated rows, and reveals synthetic credentials only
    to an authorized admin. A corrupt file, provider timeout, or invalid row ends in
    failed with explicit errors and no silent partial success. Re-uploading the same
    hash returns the existing revision; a deliberate new upload is a new revision.
  api:
    upload_import:
      method: elms.admission.import_api.upload_import
      input: organization-scoped XLSX file, optional explicit new_revision flag
      output: import name, status, schema_version, file_hash, revision, row_count
      errors: PermissionError foreign organization; ValidationError wrong MIME/empty/corrupt file; provider/timeout failure
    inspect_import:
      method: elms.admission.import_api.inspect_import
      input: import name and bounded page/filter parameters
      output: header, typed row preview, row errors, status, revision, no raw secret
      errors: PermissionError; DoesNotExist; stale or failed import remains explicit
    export_import:
      method: elms.admission.import_api.export_import
      input: parsed import name and validated-row filter
      output: admin-authorized export of structured rows, never Enrollment records
      errors: PermissionError; ValidationError when import is not parsed
    reveal_credential:
      method: elms.admission.import_api.reveal_credential
      input: credential row id and explicit one-time invite-token reveal intent
      output: protected invite_token once plus revealed_by/revealed_at audit metadata
      errors: PermissionError non-admin/foreign organization; ValidationError already revealed or invalid credential
    credential_provisioning: >-
      invite-token: create a synthetic identity/credential record with deterministic
      login/email and a protected one-time invite_token; do not create a Frappe User
      in this epic.
    authz: >-
      ELMS Company Admin may operate only on its own organization; ELMS Admin and
      ELMS Operations User may inspect/export and reveal invite_token within their platform scope;
      Guest, Learner, and foreign Company Admin are denied. UI is not the security
      boundary. Import APIs never call enrollment methods.
  persistence: >-
    ELMS Admission Import stores organization, source file/hash, schema_version,
    revision, typed status, header fields, parse error and timestamps. Child import
    rows store normalized DTO fields, row status, source row number, deterministic
    identity reference and row errors. ELMS Admission Credential stores a synthetic
    identity/credential record with deterministic login/email, a protected encrypted
    one-time invite_token, reveal audit, and parent row. This invite-token contract
    does not create a Frappe User in this epic. Unique organization+file_hash returns
    the existing import unless new_revision is explicit. No Enrollment link or
    Enrollment insert is present in this boundary.
  done: >-
    Both supplied fixtures parse to typed rows with header fields and the Сметанин
    FIO+SNILS assertion; invalid rows and corrupt files are visibly failed; rows
    without email receive a synthetic identity/credential record with deterministic
    login/email and a protected one-time invite_token reveal; no Frappe User is
    created in this epic; same-file retries are idempotent or explicit revisions;
    export and preview are organization-scoped; and static/runtime evidence proves
    zero Enrollment calls or documents from this epic.

