tdd:
  - Red: reject wrong MIME, empty/corrupt XLSX, unsupported schema version, malformed AI JSON, and invalid SNILS/date with typed failed status and no parsed success.
  - Red: parse both supplied fixtures and assert mapped headers plus the Сметанин FIO+SNILS golden row.
  - Red: missing email creates a deterministic unique synthetic identity/credential record with login/email and protected one-time invite_token; no Frappe User is created; repeat parse is idempotent by organization/file hash unless a new revision is explicit.
  - Red: Company Admin scope, foreign organization, Learner/Guest denial, reveal audit, export authorization, and no Enrollment calls/documents.
  - Green: implement DocTypes, DTO/service/API, Desk preview/export/reveal, and scoped styles; run targeted tests, syntax, compile, and leftover checks.

