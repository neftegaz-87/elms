schema: epic-decompose-index/v1
plan_id: T-A11-elms-ai-admission-parse
level: L3
sNN_cap: 3
appetite:
  timebox_days: 5
  cut_list:
  - B2B Enrollment creation, quota decrement, or T-A12 handoff execution
  - B2C admission profile, payment, 1C billing, or Bitrix status SoT
  - Custom fields for Course/Program/Batch
  - OCR or non-tabular scans beyond the XLSX fixture contract
  - Provider-specific AI transport configuration outside T-A06 OmniRoute patterns
  rationale: 'One ship-ready import boundary is required before T-A12: the company
    upload must become validated rows and admin-releasable synthetic credentials,
    while enrollment remains an explicit downstream responsibility.'
effort_probe:
  outcomes:
  - outcome: Admission XLSX import vertical slice with preview, errors, and synthetic
      credentials
    hours_mid: 32.0
    hours_range: 24-40
    confidence: medium
    notes: Parent/row/credential DocTypes, fixture-backed Pydantic validation, bounded
      OmniRoute parse call, idempotent file hash, Company Admin API/UI preview, one-time
      credential reveal audit, export, and contract/browser evidence.
  total_hours: 32.0
  effort_hours_total: 32.0
  effort_class: L
  independent_outcomes: 1
  split_seams: 0
  sNN_cap: 3
  sNN_target: 1
split_rationale: 'This is one cohesive machine boundary: upload, parse, validation,
  persistence, preview, credential release, and export cannot be accepted independently
  because T-A12 consumes the persisted structured rows. Keeping backend, Desk UI,
  AI wire, and no-enrollment enforcement in one shard preserves the vertical slice.'
technology_axiom_lock:
- Pydantic AdmissionRow and typed import status are the only accepted validation/status
  SoT; regex-only Excel scraping is forbidden.
- The fixture blank-zayavka-2026.xlsx is the column/schema SoT, with an explicit schema_version;
  ad-hoc aliases are forbidden.
- OmniRoute/neftegaz-ai-layer produces structured JSON that is validated before any
  row is presented as parsed.
- Missing email produces deterministic synthetic identity data and an encrypted/Password
  vault secret with one-time reveal audit.
- This epic never creates, mutates, or calls an ELMS Enrollment API; rows are the
  only T-A12 handoff.
steps:
