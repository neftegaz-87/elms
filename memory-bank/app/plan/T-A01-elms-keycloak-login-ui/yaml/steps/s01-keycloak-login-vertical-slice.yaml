  fr_coverage:
  - id: FR-004
    section: FR-004 — Environment and typed Python settings
    details: The typed adapter uses pydantic-settings and SecretStr for all seven
      settings variables, validates URLs/booleans/roles, preserves unconfigured Yandex
      in development, removes legacy yandex_login, and keeps Yandex credentials out
      of Frappe site_config.json.
  - id: FR-005
    section: FR-005 — Keycloak realm and Yandex broker
    details: The env-backed elms realm uses the confidential elms-frappe client, public
      issuer, bounded redirect, exact yandex OIDC broker, normalized claims, registrationAllowed=false,
      and entrypoint branches for empty, partial, and present Yandex credentials.
