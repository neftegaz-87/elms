schema: epic-decompose/v1
role: app
step_id: s01
plan_id: T-A01-elms-keycloak-login-ui
title: Unified Keycloak login vertical slice (scoped CSS, typed settings, Docker env,
  tests, and wire journey)
next_phase: APP IMPLEMENT
needs_creative: 'no'
goal: 'Реализовать единый вертикальный срез входа через Keycloak на стандартной странице
  Frappe /login:

  1. Scoped CSS asset elms/elms/public/css/login.css в визуальном языке Neftegaz (44px
  control, 3px radius, cobalt action, focus/reduced-motion) и подключение через web_include_css
  в hooks.py.

  2. Адаптер настроек elms/elms/sso/settings.py на базе pydantic-settings для строгой
  типизации и валидации env (KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, KEYCLOAK_PUBLIC_URL,
  ELMS_SSO_REQUIRE), с делегированием из conf.py и сохранением fail-closed поведения.

  3. Передача env и проверка секретов в docker/compose.dev.yaml, docker/compose.prod.yaml,
  docker/keycloak/realm-elms.json, docker/keycloak/entrypoint.sh, docker/.env.dev.example,
  docker/.env.prod.example и docker/README.md.

  4. Тесты контракта login UI, типизированных настроек, callback/RBAC и отсутствия
  прямого Yandex провайдера в Frappe.

  5. Проверка live smoke и подготовка manual-ac.md чеклиста для приёмки оператора.'
