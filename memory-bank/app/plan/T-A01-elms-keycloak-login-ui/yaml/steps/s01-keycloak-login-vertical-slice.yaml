  ac_quotes:
  - 'AC-001 — Configured login button: Given valid Keycloak configuration, the page
    contains exactly one visible .btn-keycloak control whose href starts with the
    public KEYCLOAK_PUBLIC_URL/realms/elms, never keycloak:8080, and the ELMS login
    CSS asset is loaded'
  - 'AC-002 — Styled visual states: Given the configured button, hover, focus, activation,
    disabled, and reduced-motion states use the Neftegaz palette/geometry, maintain
    readable contrast, and do not shift layout'
  - 'AC-003 — Local Keycloak end-to-end flow: Given an explicitly provisioned local
    Keycloak user, the callback creates an authenticated Frappe session with linked
    sub, expected default roles, and a redirect to /app'
  - 'AC-004 — Yandex broker end-to-end flow: Given non-empty Yandex credentials, Keycloak
    creates/links the realm user and Frappe creates/links the User by Keycloak sub;
    Frappe never calls a Yandex endpoint directly'
  - 'AC-005 — Fail closed: Missing Keycloak credentials disable the Social Login Key
    in dev, missing required credentials make create-site exit non-zero, and OAuth
    denial/state mismatch/token error/missing role creates no authenticated session'
  - 'AC-006 — No secret leakage: No real Keycloak/Yandex secret is tracked, no secret
    is printed in settings errors/logs, and Yandex secrets are absent from Frappe
    site_config.json'
  - 'AC-007 — Existing RBAC remains intact: Default SSO roles are applied through
    the existing hook and Frappe DocPerm remains authoritative when a role is absent'
