as_built:
- Frappe login page /login serves stock buttons and supports Social Login Key Keycloak
  via ensure.py and conf.py
- elms/elms/hooks.py exists without login CSS web_include_css registration
- elms/elms/sso/conf.py injects raw os.environ values into site_config without typed
  pydantic validation
- docker/keycloak/realm-elms.json defines elms realm and elms-frappe client but entrypoint.sh
  does not yet isolate env substitution safely
- scripts/live_smoke.sh tests basic health without checking login CSS asset inclusion
  or public Keycloak issuer in browser HTML
delta:
- 'Create scoped login CSS asset in elms/elms/public/css/login.css with Neftegaz tokens
  (44px control, 3px radius, #0d4cd3 action, focus/reduced-motion) and register in
  elms/elms/hooks.py via web_include_css'
- Implement typed env settings in elms/elms/sso/settings.py using pydantic-settings,
  validating client ID/secret, public URL and requirement flags, and wire into elms/elms/sso/conf.py
- Add pydantic-settings dependency to elms/pyproject.toml
- Update docker/compose.dev.yaml and docker/compose.prod.yaml to ensure environment
  variable propagation, and add docker/keycloak/entrypoint.sh for secure realm import
  rendering without secret leakage
- Add test_login_ui.py to verify rendered HTML, single Keycloak button, public URL,
  absence of direct Yandex provider, and CSS asset inclusion
- Update test_sso_config.py, test_sso_ensure.py, and test_sso.py to cover typed settings
  and fail-closed branches
- Update scripts/live_smoke.sh and add memory-bank/app/plan/T-A01-elms-keycloak-login-ui/md/manual-ac.md
  for operator verification
