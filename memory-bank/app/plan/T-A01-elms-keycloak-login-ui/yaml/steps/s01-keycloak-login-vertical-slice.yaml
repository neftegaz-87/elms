checkpoints:
- id: cp1
  criterion: Scoped login CSS asset exists with Neftegaz tokens and is registered
    in hooks.py
  verify: test -f elms/elms/public/css/login.css && grep -q 'login.css' elms/elms/hooks.py
- id: cp2
  criterion: Typed SSO settings adapter validates environment variables using pydantic-settings
  verify: python3 -c 'from elms.sso.settings import SsoSettings; s = SsoSettings(keycloak_client_id="elms-frappe",
    keycloak_client_secret="sec", keycloak_public_url="http://127.0.0.1:8480"); assert
    s.keycloak_client_id == "elms-frappe"'
- id: cp3
  criterion: Site config injection integrates with typed settings and enforces fail-closed
    behavior
  verify: python3 -c 'import elms.sso.conf; assert hasattr(elms.sso.conf, "inject_sso_site_config")'
- id: cp4
  criterion: Keycloak entrypoint and compose files handle env substitution safely
    without leaking secrets
  verify: test -f docker/keycloak/entrypoint.sh && ! rg -i "(client_secret|password)\\s*[:=]\\s*[\"0-9a-zA-Z]{16,}"
    docker/keycloak/entrypoint.sh
- id: cp5
  criterion: Rendered login and SSO tests assert single Keycloak provider, public
    URL, and absence of direct Yandex provider
  verify: test "$(rg -n 'custom/yandex|yandex_login' elms/elms docker .env.example
    || true)" = ""
- id: cp6
  criterion: Live smoke script verifies Keycloak discovery, login CSS, and absence
    of container-only URLs
  verify: grep -q 'KEYCLOAK_PUBLIC_URL' scripts/live_smoke.sh
- id: cp7
  criterion: FR-004 settings coverage names and tests all seven contract variables
    — KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, KEYCLOAK_PUBLIC_URL, YANDEX_CLIENT_ID,
    YANDEX_CLIENT_SECRET, ELMS_SSO_DEFAULT_ROLES, and ELMS_SSO_REQUIRE
  verify: rg -q 'KEYCLOAK_CLIENT_ID' elms/elms/sso/settings.py && rg -q 'KEYCLOAK_CLIENT_SECRET'
    elms/elms/sso/settings.py && rg -q 'KEYCLOAK_PUBLIC_URL' elms/elms/sso/settings.py
    && rg -q 'YANDEX_CLIENT_ID' elms/elms/sso/settings.py && rg -q 'YANDEX_CLIENT_SECRET'
    elms/elms/sso/settings.py && rg -q 'ELMS_SSO_DEFAULT_ROLES' elms/elms/sso/settings.py
    && rg -q 'ELMS_SSO_REQUIRE' elms/elms/sso/settings.py
- id: cp8
  criterion: FR-004 settings integration removes legacy direct yandex_login from site
    config while retaining only the Keycloak provider contract
  verify: test "$(rg -n 'custom/yandex|yandex_login' elms/elms docker .env.example
    || true)" = ""
- id: cp9
  criterion: 'FR-005 entrypoint explicitly handles the three Yandex credential branches:
    both empty disables the broker, exactly one fails bootstrap, and both present
    enables the broker'
  verify: rg -q 'YANDEX_CLIENT_ID' docker/keycloak/entrypoint.sh && rg -q 'YANDEX_CLIENT_SECRET'
    docker/keycloak/entrypoint.sh
verify:
- python3 -c 'from elms.sso.constants import KEYCLOAK_PROVIDER_NAME, YANDEX_IDP_ALIAS;
  assert (KEYCLOAK_PROVIDER_NAME, YANDEX_IDP_ALIAS) == ("Keycloak", "yandex")'
- test -f elms/elms/public/css/login.css
- grep -q 'login.css' elms/elms/hooks.py
- test "$(rg -n 'custom/yandex|yandex_login' elms/elms docker .env.example || true)"
  = ""
- '! rg -i ''(client_secret|password)\s*[:=]\s*["0-9a-zA-Z]{16,}'' docker/ elms/ .env.example'
