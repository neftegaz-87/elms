out_of_scope:
  - Vue or React login SPA or Frappe template fork
  - Direct Frappe to Yandex Social Login Key or direct Yandex callback
  - SCIM or bulk directory import
  - Copying Yandex passwords into Keycloak or Frappe
  - Workspaces, Section DocTypes, Desk shell and role navigation from T-F01
  - Product domain screens for Operations or LMS
  - Global Frappe theme rewrite or dark mode
  - Separate BACK/FRONT/INTEG epics for this slice
