tdd:
- Add API and UI contract assertions before implementation
- Add nested save/ownership tests for the course draft endpoint
- Implement endpoint, route, editor and workspace integration
- Preserve learner get_course_structure contract

verify:
- ./bin/pytest -q elms/elms/tests/test_course_studio.py elms/elms/tests/test_lms_core.py
- ./bin/pytest -q elms/elms/tests/test_learning_ui.py elms/elms/tests/test_workspaces.py
- node --check elms/elms/public/js/course-studio.js
- node --check elms/elms/public/js/elms-course-studio-page.js
- node --check elms/elms/public/js/desk-learning.js
- python3 -m py_compile elms/elms/lms/api.py
- rg -n "get_course_editor_data|save_course_draft|elms-course-studio|course-studio" elms/elms/lms/api.py elms/elms/public/js elms/elms/hooks.py elms/elms/desk/workspaces.py

