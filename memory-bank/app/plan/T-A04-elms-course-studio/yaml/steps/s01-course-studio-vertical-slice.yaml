  verify: ./bin/pytest -q elms/elms/tests/test_learning_ui.py elms/elms/tests/test_workspaces.py
- id: cp3
  criterion: Existing learner structure and LMS core contracts remain green
  verify: ./bin/pytest -q elms/elms/tests/test_lms_core.py
- id: cp4
  criterion: JavaScript parses and production call sites point to the Course Studio route
  verify: node --check elms/elms/public/js/course-studio.js && node --check elms/elms/public/js/elms-course-studio-page.js && node --check elms/elms/public/js/desk-learning.js
- id: cp5
  criterion: Mixed wire contract is present and old direct authoring route is no longer the primary management path
  verify: rg -n "get_course_editor_data|save_course_draft|elms-course-studio" elms/elms/lms/api.py elms/elms/public/js elms/elms/hooks.py elms/elms/desk/workspaces.py

wire_complete:
  call_sites:
  - "LMS Workspace -> Course Studio shortcut -> /app/elms-course-studio"
  - "Management tab -> create/open course -> Course Studio"
  - "Course Studio -> elms.lms.api.get_course_editor_data -> nested persisted outline"
  - "Course Studio -> elms.lms.api.save_course_draft -> ELMS Course/Chapter/Lesson/Quiz"
  - "Learner preview/player -> elms.lms.api.get_course_structure -> same persisted outline"
  enforce_path: elms/elms/lms/api.py
  dual_path_rg: rg -n "get_course_editor_data|save_course_draft|get_course_structure" elms/elms/lms/api.py elms/elms/public/js
  instruction_rg: rg -n "elms-course-studio|ELMS Course Chapter|ELMS Course Lesson" elms/elms/desk/workspaces.py elms/elms/public/js/desk-learning.js
  deny_old_proven: true
