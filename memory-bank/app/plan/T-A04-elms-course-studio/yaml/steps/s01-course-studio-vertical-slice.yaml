deletes:
- path: elms/elms/desk/workspaces.py
  symbol: Direct ELMS Course Chapter and ELMS Course Lesson authoring links
  replacement: Course Studio shortcut
- path: elms/elms/public/js/desk-learning.js
  symbol: Separate chapter/lesson management entry points
  replacement: Course Studio route

out_of_scope:
- AI or document import; this slice only accepts structured course editor payloads.
- Full quiz/question bank authoring; existing ELMS Quiz records remain available.
- Real-time multi-author collaboration; single-author draft save is the contract.

