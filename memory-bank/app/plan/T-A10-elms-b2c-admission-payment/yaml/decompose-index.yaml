split_rationale: 'Three independently verifiable acceptance boundaries: (1) profile+docs+consent
  can be saved and validated without payment; (2) payment create/webhook enroll can
  be proven with fake provider once profile exists; (3) free B2C enroll path DENY/purge
  is a separate leftover_sot enforce outcome. Each mixed shard keeps backend+Desk
  UI+wire for its boundary — no BACK/FRONT/INTEG split.'
technology_axiom_lock:
- Pydantic LearnerProfile DTO JSON on save_profile boundary; FORBIDDEN regex extract
  prose passport into enum
- PaymentStatus Literal/Enum from validated webhook JSON; FORBIDDEN free-text «оплачено»
  UI as SoT
- Enrollment Active for B2C only via server after paid payment_id link; FORBIDDEN
  desk checkbox «считать оплаченным» without payment event
- DocType name ELMS Admission Profile (avoid Role Profile document name collision
  with «ELMS Learner Profile»); product noun remains Learner Profile
