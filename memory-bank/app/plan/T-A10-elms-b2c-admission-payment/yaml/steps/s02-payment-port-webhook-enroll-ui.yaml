  - enroll after paid
  - Desk pay CTA waiting success
  layout_paths:
  - elms/elms/admission/payment.py
  - elms/elms/admission/provider.py
  - elms/elms/admission/webhook.py
  - elms/elms/elms_core/doctype/elms_payment/
  - elms/elms/public/js/desk-admission.js
  - elms/elms/tests/test_admission_payment.py
  - elms/elms/tests/test_admission_webhook.py
  plan_jumps:
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:59-114
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:86-123
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:138-147
  ac_quotes:
  - "AC-001: Given registered Learner + published batch; When profile incomplete; Then payment create rejected with typed error."
  - "AC-002: Given complete profile+files+consent; When create_payment; Then Payment record pending and provider session returned."
  - "AC-003: Given valid signed webhook paid; When handled; Then Enrollment Active exists exactly once for (user,batch)."
  - "AC-004: Given webhook failed or unsigned; When handled; Then no Active Enrollment; error logged."
  user_journey: >-
    After complete profile (s01), Learner presses pay CTA on /app/elms-admission.
    create_payment returns provider session/URL; UI shows waiting. Fake/test
    webhook paid → Enrollment Active → success with learning link. failed/unsigned
    → explicit error, no Active enrollment.
  api:
    create_payment:
      method: elms.admission.api.create_payment
      input: course, batch (amount/currency from batch/course meta or settings)
      output: payment name, status=pending, provider_session
      errors: ValidationError incomplete profile; DoesNotExist batch; ConfigurationError missing provider when payments enabled
    payment_webhook:
      method: elms.admission.api.payment_webhook
      handler: elms.admission.webhook.handle_payment_webhook
      call_site: >-
        elms.admission.api.payment_webhook ->
        elms.admission.webhook.handle_payment_webhook -> parse_webhook ->
        paid -> elms.lms.api.enroll_learner once with payment ref
      input: headers + raw body
      output: ack; side-effect enroll once on paid
      errors: reject invalid signature; ignore duplicate event id
    authz: >-
      create_payment = authenticated learner for self; webhook = signature verified
      (no session). Admin/Ops may read ELMS Payment status (no local paid override).
  roles:
    learner: start own payment; see own status
    webhook: provider signature only
    admin: read payment+profile; FORBIDDEN set paid without event
  persistence: >-
    ELMS Payment stores user, batch, course, amount, currency, status Enum,
    provider_payment_id, last_event_id. Paid → call enroll path once; Progress zero.
  done: >-
    AC-001..004 green with fake provider; UI pay/waiting/success wired; no dual
    free-text paid SoT; missing adapter fail-closed when payments enabled.

