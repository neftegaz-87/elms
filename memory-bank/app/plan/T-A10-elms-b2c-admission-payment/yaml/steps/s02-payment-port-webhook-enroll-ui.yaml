as_built:
- No Payment DocType / provider port; enroll_self creates Active Enrollment immediately.
- Bitrix Application Link (T-A08) is separate lead contour — not payment SoT.
- s01 Admission Profile completeness helpers must exist before create_payment gate.

delta:
- Add PaymentProvider port + fake adapter; ELMS Payment DocType; create_payment gated on complete profile.
- Add signed webhook handler → paid enroll once / failed no enroll; idempotent by event id.
- Wire Desk pay CTA → waiting → success/error to real APIs.
- Fail-closed when payments enabled and production adapter missing (no stub enroll).

