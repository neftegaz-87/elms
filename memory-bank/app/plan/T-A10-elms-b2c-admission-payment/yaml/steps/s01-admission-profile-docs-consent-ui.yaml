goal: >-
  Дать зарегистрированному слушателю единственный typed SoT анкеты поступления
  (ELMS Admission Profile): обязательные поля ПДн, сканы паспорт/СНИЛС/образование,
  согласие 152-ФЗ с версией текста; Desk шаги выбор курса → анкета → upload до оплаты.

plan_contract:
  fr_ids: [FR-001]
  nfr_ids: [NFR-001, NFR-003]
  us_ids: [US-001]
  ac_ids: [AC-006]
  nouns:
  - ELMS Admission Profile
  - LearnerProfile Pydantic DTO
  - save_profile whitelist
  - passport_scan
  - snils_scan
  - education_doc_scan
  - consent version+timestamp
  - Desk admission profile form
  - private File ACL
  layout_paths:
  - elms/elms/admission/
  - elms/elms/elms_core/doctype/elms_admission_profile/
  - elms/elms/operations/page/elms_admission/
  - elms/elms/public/js/desk-admission.js
  - elms/elms/public/css/desk-admission.css
  - elms/elms/tests/test_admission_profile.py
  - elms/elms/tests/test_admission_ui.py
  plan_jumps:
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:16-37
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:59-114
  - memory-bank/app/plan/T-A10-elms-b2c-admission-payment/md/plan.md:75-123
  ac_quotes:
  - "AC-006: Given authenticated Learner; When save_profile without required fields or required scans or PD consent; Then typed ValidationError and no complete profile; When all required present; Then one ELMS Admission Profile per User persists with private files."
  - "US-001: Как слушатель, заполняю анкету и загружаю сканы до оплаты."
  - "FR-001: Fields FIO/birth/passport/SNILS/education/profession/phone/email/consent; Files passport_scan, snils_scan, education_doc_scan; One profile per User; upsert API."
  - "NFR-001: Private file access only owner/Admin/Operations."
  - "NFR-003: PII masked in logs."
  user_journey: >-
    Learner opens Workspace admission /app/elms-admission, selects published
    course/batch, fills LearnerProfile form, attaches three required private
    scans, checks PD consent with stored text version. Incomplete required
    field/file → typed 4xx; success → profile ready for create_payment (s02).
  api:
    save_profile:
      method: elms.admission.api.save_profile
      input: >-
        JSON LearnerProfile (fio parts, birth_date, passport_series/number,
        snils, education_level, profession, phone) + consent_version; files via
        Frappe attach to DocType
      output: profile name, completeness flags, attached file ids
      errors: ValidationError missing required; PermissionError Guest/foreign user
    get_profile:
      method: elms.admission.api.get_profile
      input: optional user (Admin/Ops); default session user
      output: LearnerProfile DTO + file meta (no raw PII dump in logs)
    authz: >-
      Learner upserts own profile only; Admin/Operations read; private files
      owner or Admin/Operations. FORBIDDEN public File URLs.
  roles:
    learner: ELMS Learner — own profile R/W
    admin: ELMS Admin / ELMS Operations User — read
    denied: Guest; Learner reading foreign profile
  persistence: >-
    One ELMS Admission Profile per User (unique user). Consent_version +
    consent_timestamp required on complete submit. Files private is_private=1.
  done: >-
    Incomplete profile fails validation; complete+files+consent persists;
    foreign file access DENY; Desk form wires real save_profile; PII not logged
    in cleartext.

