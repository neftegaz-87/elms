  - "desk-learning catalog CTA -> elms-admission pay journey (not free enroll_self)"
  enforce_path: elms/elms/admission/enforce.py
  dual_path_rg:
  - 'rg -n ''require_paid_payment|subscription'' elms/elms/admission/enforce.py elms/elms/lms/api.py'
  - 'rg -n ''elms-admission'' elms/elms/public/js/desk-learning.js && ! rg -n ''enroll_self'' elms/elms/public/js/desk-learning.js'
  instruction_rg: 'rg -n ''проставить оплачено|без оплаты|без webhook'' elms/elms/public/js/desk-learning.js elms/elms/public/js/desk-admission.js elms/elms/admission'
