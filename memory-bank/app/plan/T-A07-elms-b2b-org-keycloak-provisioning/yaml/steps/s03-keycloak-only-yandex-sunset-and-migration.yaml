  ac_quotes:
  - "AC-004: The realm seed and runtime migration are Keycloak-only: no enabled Yandex provider or broker hint remains."
  api:
    migrate_yandex_users:
      method: elms.access.api.migrate_yandex_users
      input: dry_run optional boolean
      output: migrated count, skipped count, errors
      errors: PermissionError, KeycloakProvisionError
    login: Keycloak local password/OIDC callback without kc_idp_hint=yandex
  roles:
    migration: ELMS Admin / Administrator only
    login: Keycloak only
  persistence: >-
    Realm seed is the source for new environments; migration is idempotent and
    records required actions before Yandex provider removal. No Yandex secret is
    required by the ELMS login path after this step.
  done: >-
    JSON/runtime scans, unit tests and live smoke prove no enabled Yandex IdP or
    Yandex-dependent login path remains, while Keycloak callback/JIT still works.

