- docker/keycloak/realm-elms.json — enabled Yandex identity provider and mappers are seeded.
- elms/elms/tests/test_login_ui.py — current acceptance expects a Yandex broker button.
- scripts/live_smoke.sh — current smoke has broker/Yandex assumptions that must be removed or inverted.

