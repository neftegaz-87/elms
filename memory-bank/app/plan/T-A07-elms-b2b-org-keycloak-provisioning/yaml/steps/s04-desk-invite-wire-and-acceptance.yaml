  fr_ids: [FR-001, FR-002, FR-003, FR-005, FR-006]
  us_ids: [US-001, US-002, US-003, US-004, US-005]
  ac_ids: [AC-005, AC-006]
  nouns:
  - Settings/Operations Organization entry
  - Company Admin invite form
  - organization members
  - permission error state
  - wire journey
  layout_paths:
  - elms/elms/desk/workspaces.py
  - elms/elms/public/js/desk-access.js
  - elms/elms/public/css/desk-access.css
  - elms/elms/tests/test_access_ui.py
  - scripts/live_smoke.sh
  plan_jumps:
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:189-220
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:224-238
  ac_quotes:
  - "AC-005: The real Desk journey reaches the Organization and invite API with role-aware success and denial states."
  - "AC-006: The invite-to-password-to-login wire journey reaches Keycloak password setup and Keycloak-only ELMS login without a Yandex control."
  api:
    ui_calls:
    - elms.access.api.create_organization
    - elms.access.api.assign_company_admin
    - elms.access.api.invite_org_user
    roles:
      admin: create organization, assign Company Admin, invite
      company_admin: invite own organization only
      denied: Guest, Learner, cross-org target
  persistence: >-
    UI is a caller only; all scope and role enforcement remains in Frappe
    whitelist methods. No client-side organization filter is treated as security.
  done: >-
    Desk assets parse, workspace links are present, real method names are wired,
    browser/live/wire evidence covers happy and denial journeys, and no Yandex
    control is rendered.

