checkpoints:
  - id: cp1
    criterion: Workspace and Desk surface call real access methods and expose explicit denial/error states.
    verify: ./bin/pytest -q elms/elms/tests/test_access_ui.py elms/elms/tests/test_workspaces.py
  - id: cp2
    criterion: JS parses and no client-only scope or Yandex login control remains.
    verify: node --check elms/elms/public/js/desk-access.js
wire_complete:
  call_sites:
  - "Settings/Operations workspace -> Organization form -> create_organization"
  - "Organization members -> invite form -> invite_org_user -> success/error state"
  - "Invite email -> Keycloak password setup -> Keycloak-only ELMS login"
  enforce_path: elms/elms/access/api.py
  dual_path_rg: 'rg -n "frappe.call|create_organization|assign_company_admin|invite_org_user" elms/elms/public/js/desk-access.js'
  instruction_rg: 'rg -n "filter.*organization|kc_idp_hint=yandex|Login.*Yandex" elms/elms/public/js elms/elms/desk'
  deny_old_proven: true
