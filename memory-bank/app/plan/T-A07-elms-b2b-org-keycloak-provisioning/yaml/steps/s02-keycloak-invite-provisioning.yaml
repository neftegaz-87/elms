    reason: typed server-only Admin API client
  - path: elms/elms/access/api.py
    reason: invite whitelist and compensation
  - path: elms/elms/elms_core/doctype/elms_invite_log/
    reason: audit trail
  - path: elms/elms/tests/test_access_invite.py
    reason: invite contract and failure tests
  - path: elms/elms/tests/test_keycloak_admin.py
    reason: client HTTP contract tests
  plan_refs: [FR-003, FR-004, NFR-001, NFR-002, NFR-003, NFR-004, US-002, US-003, AC-002, AC-003]

as_built:
- elms/elms/sso/login.py — existing Keycloak client authenticates users but no Admin API provision client exists.
- elms/elms/install.py — Frappe User reconciliation is callback/JIT-oriented, not invite-oriented.

delta:
- Add typed Keycloak Admin API client with token, user create/update and execute-actions calls.
- Add invite whitelist, audit log, idempotency and explicit compensation on provider failure.

files:
  - elms/elms/access/keycloak.py
