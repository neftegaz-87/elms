schema: epic-decompose/v1
role: app
step_id: s02
plan_id: T-A07-elms-b2b-org-keycloak-provisioning
title: Typed Keycloak Admin client and idempotent invite provisioning
level: L2
next_phase: APP IMPLEMENT
status: ready
visible_ui: no
needs_creative: no
wire_complete_required: true

goal: >-
  Замкнуть invite: Company Admin или Admin валидирует org scope, создаёт или
  обновляет Frappe User и Keycloak user, отправляет UPDATE_PASSWORD и сообщает
  успех только после успешного Keycloak provision; ошибки typed и fail-closed.

plan_contract:
  fr_ids: [FR-003, FR-004]
  us_ids: [US-002, US-003]
  ac_ids: [AC-002, AC-003]
  nfr_ids: [NFR-001, NFR-002, NFR-004]
  nouns:
  - Keycloak Admin client
  - invite_org_user
  - KeycloakProvisionError
  - execute-actions-email UPDATE_PASSWORD
  - ELMS Invite Log
  layout_paths:
  - elms/elms/access/keycloak.py
  - elms/elms/access/api.py
  - elms/elms/elms_core/doctype/elms_invite_log/
  - elms/elms/tests/test_access_invite.py
  - elms/elms/tests/test_keycloak_admin.py
  plan_jumps:
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:147-185
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:187-220
  ac_quotes:
  - "AC-002: Invite success is reported only after both durable Frappe state and Keycloak provisioning succeed."
  - "AC-003: Re-invite is idempotent, sends `UPDATE_PASSWORD`, and never returns a password."
  api:
    invite_org_user:
      method: elms.access.api.invite_org_user
      input: email, first_name, last_name, organization, optional role_profile
      output: user, organization, keycloak_id, invited, status
      errors: PermissionError, ValidationError, KeycloakProvisionError
    client:
      endpoints: POST /admin/realms/{realm}/users, PUT user/{id}, PUT execute-actions-email
      config: KEYCLOAK_ADMIN_BASE_URL, KEYCLOAK_ADMIN_REALM, KEYCLOAK_ADMIN_CLIENT_ID, KEYCLOAK_ADMIN_CLIENT_SECRET
  roles:
    callers: ELMS Admin, ELMS Company Admin with membership
    denied: Guest, ELMS Learner, Company Admin outside organization
  persistence: >-
    Frappe User and Invite Log are durable; no password is stored or returned.
    Provision failures use explicit compensation (disable/delete local user) and
    raise a typed error.
  done: >-
    Mocked Admin API contract covers create/update/idempotency, auth/timeout/error
    paths, execute-actions and compensation; real API call sites use the same client.

context:
  consumes:
  - path: memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md
