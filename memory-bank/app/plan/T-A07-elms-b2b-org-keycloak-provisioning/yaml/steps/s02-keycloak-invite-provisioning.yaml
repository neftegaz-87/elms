tdd:
  - Add failing client and whitelist tests for auth, timeout, idempotency, action email and compensation.
  - Implement typed client, invite log and server-side invite operation.
  - Verify secret redaction and no password in response or logs.
verify:
  - ./bin/pytest -q elms/elms/tests/test_access_invite.py elms/elms/tests/test_keycloak_admin.py
  - python3 -m py_compile elms/elms/access/keycloak.py elms/elms/access/api.py
  - rg -n 'invite_org_user|UPDATE_PASSWORD|KeycloakProvisionError|client_secret|password' elms/elms/access elms/elms/tests/test_access_invite.py
checkpoints:
  - id: cp1
    criterion: Keycloak Admin client obtains token and handles status/timeout without secret leakage.
    verify: ./bin/pytest -q elms/elms/tests/test_access_invite.py elms/elms/tests/test_keycloak_admin.py
  - id: cp2
    criterion: Invite is idempotent, sends password action and compensates on provider failure.
    verify: ./bin/pytest -q elms/elms/tests/test_access_invite.py elms/elms/tests/test_keycloak_admin.py
wire_complete:
  call_sites:
  - "Company Admin invite form -> invite_org_user -> Frappe User + Keycloak user"
  - "Keycloak user -> execute-actions-email UPDATE_PASSWORD -> invite result"
  enforce_path: elms/elms/access/api.py
  dual_path_rg: 'rg -n "invite_org_user|KeycloakAdmin|UPDATE_PASSWORD" elms/elms/access elms/elms/hooks.py'
  instruction_rg: 'rg -n "password.*return|client_secret.*log|Frappe.*only" elms/elms/access elms/elms/tests'
  deny_old_proven: true
