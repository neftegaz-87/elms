goal: >-
  Создать реальную границу организации: ELMS Organization, membership,
  Company Admin profile и User Permission, чтобы администратор мог назначить
  представителя компании, а Company Admin не мог читать чужую org.

plan_contract:
  fr_ids: [FR-001, FR-002]
  nfr_ids: [NFR-004]
  us_ids: [US-001, US-004]
  ac_ids: [AC-001]
  nouns:
  - ELMS Organization
  - ELMS Organization Member
  - ELMS Company Admin
  - ELMS Company Admin Profile
  - User Permission
  - assign_company_admin
  layout_paths:
  - elms/elms/elms_core/doctype/elms_organization/
  - elms/elms/elms_core/doctype/elms_organization_member/
  - elms/elms/access/api.py
  - elms/elms/install.py
  - elms/elms/permissions.py
  - elms/elms/tests/test_access_model.py
  - elms/elms/tests/test_roles_rbac.py
  plan_jumps:
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:135-169
  - memory-bank/app/plan/T-A07-elms-b2b-org-keycloak-provisioning/md/plan.md:189-220
  ac_quotes:
  - "AC-001: Admin creates an Organization and assigns a Company Admin with a matching User Permission scope."
  user_journey: >-
    Admin opens the Organization form, saves company identity fields and assigns
    a Frappe user as Company Admin. The server creates the role profile,
    membership and matching User Permission; cross-org reads fail closed.
  api:
    create_organization:
      method: elms.access.api.create_organization
      input: name, inn, optional ogrn/kpp/status
      output: organization name
      errors: ValidationError, PermissionError
    assign_company_admin:
      method: elms.access.api.assign_company_admin
      input: user, organization
      output: user, organization, role_profile
      errors: PermissionError, DoesNotExist, ValidationError
  roles:
    admin: ELMS Admin
    company_admin: ELMS Company Admin
    denied: Guest, ELMS Learner without explicit membership
  persistence: >-
    Organization is a first-class DocType. Membership is explicit and its
    save/delete path reconciles User Permission allow=ELMS Organization.
  done: >-
    DocTypes, seed roles/profile, server permission checks and tests prove that
    organization scope is enforced independently of the Desk UI.

