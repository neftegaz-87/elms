goal: >-
  Дать ELMS Company Admin (и ELMS Admin) кабинет «Моя организация»: server-side
  roster только своей org с enrollment status и progress_percentage из ELMS
  Course Progress, Desk table + empty state; cross-org → PermissionError.

plan_contract:
  fr_ids: [FR-001, FR-002, FR-004]
  nfr_ids: [NFR-001, NFR-003]
  us_ids: [US-001, US-002, US-004, US-005]
  ac_ids: [AC-001, AC-002, AC-003, AC-005]
  nouns:
  - get_org_roster
  - OrgRosterDTO
  - ELMS Organization Member
  - ELMS Enrollment
  - ELMS Course Progress
  - progress_percentage
  - require_organization_access
  - Desk cabinet page
  - empty state
  layout_paths:
  - elms/elms/cabinet/
  - elms/elms/operations/page/elms_cabinet/
  - elms/elms/public/js/desk-cabinet.js
  - elms/elms/public/css/desk-cabinet.css
  - elms/elms/desk/workspaces.py
  - elms/elms/tests/test_cabinet_roster.py
  - elms/elms/tests/test_cabinet_ui.py
  plan_jumps:
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:16-27
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:53-108
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:70-95
  ac_quotes:
  - "AC-001: Given Company Admin A in org1 and users in org1/org2; When get_org_roster for org1; Then only org1 members are returned."
  - "AC-002: Given Company Admin A in org1; When get_org_roster (or export) for org2; Then PermissionError / explicit access denial."
  - "AC-003: Given enrollment Active and ELMS Course Progress progress_percentage=40; When roster row; Then enrollment status and progress_pct=40 are shown; missing progress row → documented 0."
  - "AC-005: Given organization with zero members; When cabinet opens; Then explicit empty state is shown (no fake rows)."
  progress_semantics: >-
    progress_pct = ELMS Course Progress.progress_percentage for the enrollment;
    if no Course Progress row exists → 0.0 (documented, not null inventing a second SoT).
  user_journey: >-
    Company Admin opens Workspace «Кабинет компании» /app/elms-cabinet. Page
    calls get_org_roster for primary membership org (Admin may pass organization).
    Table shows FIO/email/account status, enrollments with status and %. Empty
    membership → empty state copy. Cross-org API call shows explicit error.
  api:
    get_org_roster:
      method: elms.cabinet.api.get_org_roster
      input: >-
        organization (optional; default = caller primary org membership);
        status_filter optional; page / page_size (default 50, max 500)
      output: >-
        organization, total, page, rows[{user, full_name, email, user_enabled,
        roles (learner/profile flags), enrollments[{enrollment, course,
        course_name, status, progress_pct, last_activity?}]}]
      errors: PermissionError cross-org; ValidationError bad page_size; DoesNotExist org
    authz: >-
      Reuse elms.access.api.require_organization_access — ELMS Admin any org;
      Company Admin only membership org. FORBIDDEN trusting client user list.
  roles:
    company_admin: ELMS Company Admin — own org roster
    admin: ELMS Admin — any org select
    denied: Guest, Learner, Company Admin for foreign org
  persistence: >-
    Read-only over ELMS Organization Member, User, ELMS Enrollment, ELMS Course
    Progress. No new progress SoT DocType. Optional thin audit of roster views
    deferred; export audit is s02.
  done: >-
    Two-org fixture proves AC-001/002; progress join proves AC-003; Desk page
    wires real get_org_roster with empty state; leftover_sot rg finds no
    unfiltered User dump used as cabinet path.

