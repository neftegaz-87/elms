plan_id: T-A09-elms-company-admin-cabinet
title: Org progress CSV export and audit wire
level: L2
next_phase: APP IMPLEMENT
status: ready
visible_ui: yes
needs_creative: no
wire_complete_required: true

goal: >-
  Дать Company Admin/Admin server-side выгрузку CSV тех же строк, что roster,
  с тем же org ACL, лимитом 5000 строк, UTF-8 и аудитом «кто выгрузил»; кнопка
  Export на кабинете зовёт реальный whitelist, не DOM-CSV.

plan_contract:
  fr_ids: [FR-003]
  nfr_ids: [NFR-002]
  us_ids: [US-003]
  ac_ids: [AC-004]
  nouns:
  - export_org_progress
  - UTF-8 CSV
  - export audit
  - 5000 row cap
  - Export button
  layout_paths:
  - elms/elms/cabinet/api.py
  - elms/elms/cabinet/export.py
  - elms/elms/public/js/desk-cabinet.js
  - elms/elms/tests/test_cabinet_export.py
  plan_jumps:
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:53-60
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:80-95
  - memory-bank/app/plan/T-A09-elms-company-admin-cabinet/md/plan.md:99-120
  ac_quotes:
  - "AC-004: When export_org_progress; Then UTF-8 CSV contains the same users/rows as roster for that org and never includes org2."
  user_journey: >-
    On cabinet page, Admin/Company Admin clicks Export. Browser calls
    export_org_progress; server reuses roster query under require_organization_access,
    builds CSV (org+date filename), writes audit, returns file/content. Cap
    exceeded → clear ValidationError. Cross-org → PermissionError.
  api:
    export_org_progress:
      method: elms.cabinet.api.export_org_progress
      input: organization optional; status_filter optional (same as roster)
      output: >-
        file download or {filename, content_base64/csv_text, row_count,
        organization}; charset UTF-8; filename elms-org-{org}-{YYYYMMDD}.csv
      errors: PermissionError; ValidationError if row_count would exceed 5000
    audit: >-
      Durable log row (ELMS Invite Log-style or ELMS User Activity / dedicated
      ELMS Cabinet Export Log) with user, organization, row_count, timestamp;
      no PII dump beyond org id and counts in logs.
  roles:
    company_admin: own org export
    admin: any org export
    denied: foreign org; Guest; Learner
  persistence: >-
    Same read model as s01 roster. Add lightweight export audit DocType or
    activity record. No xlsx in P0.
  done: >-
    Export rows match roster for fixture org; org2 absent; cap error proven;
    Desk Export button calls export_org_progress; no client-only CSV path.

