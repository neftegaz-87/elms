- Typed whitelist roster/export DTO; FORBIDDEN client-supplied arbitrary user list
  without server membership filter
- progress_pct SoT = ELMS Course Progress.progress_percentage; FORBIDDEN parallel
  CompanyProgress DocType
- Export generated server-side from same org query as roster; FORBIDDEN browser-only
  CSV from unchecked DOM
- Authz via require_organization_access (Admin or Company Admin membership); UI filter
  ≠ security
