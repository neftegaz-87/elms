checkpoints:
- id: cp1
  criterion: All 7 LMS DocTypes are created with valid json schemas and Python controllers
  verify: python3 -c 'import json, pathlib; p = pathlib.Path("elms/elms/lms/doctype"); assert len(list(p.glob("*/*.json"))) >= 7'
- id: cp2
  criterion: Desk Workspace LMS is updated with structured cards and verified in workspaces.py
  verify: grep -q 'ELMS Batch' elms/elms/desk/workspaces.py && grep -q 'ELMS Enrollment' elms/elms/desk/workspaces.py
- id: cp3
  criterion: Whitelist API module elms.lms.api exists with enroll_learner, record_lesson_progress, and calculate_course_progress
  verify: python3 -c 'import elms.elms.lms.api as api; assert hasattr(api, "enroll_learner") and hasattr(api, "record_lesson_progress")'
- id: cp4
  criterion: Test suite test_lms_core.py passes 100 percent of tests for quotas, progress, and telemetry
  verify: bin/pytest -q elms/elms/tests/test_lms_core.py
