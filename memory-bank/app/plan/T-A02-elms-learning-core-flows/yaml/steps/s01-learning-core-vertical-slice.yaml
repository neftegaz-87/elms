schema: epic-decompose/v1
role: app
step_id: s01
plan_id: T-A02-elms-learning-core-flows
title: Unified Core Learning Flows vertical slice (DocTypes, Whitelist API, Quotas, Telemetry, Progress, Workspace LMS, and Tests)
next_phase: APP IMPLEMENT
needs_creative: 'no'
goal: 'Реализовать единый вертикальный срез учебного контура (Core Learning Flows) на Frappe Framework:

  1. Доменные DocTypes в модуле LMS: ELMS Batch (потоки/группы), ELMS Subscription (корпоративные квоты мест), ELMS Enrollment (зачисления), ELMS Course Progress (прогресс курса и допуск к экзамену), ELMS Lesson Progress (прогресс уроков и время изучения), ELMS User Activity (журнал сессий и действий 152-ФЗ), ELMS Video Watch Log (фиксация просмотра видео 816 приказ).

  2. Обновление конфигурации Desk Workspace LMS в elms/elms/desk/workspaces.py: структурированные карточки «Управление обучением», «Успеваемость и активность», «Аттестация и документы».

  3. Whitelist API методы в elms/elms/lms/api.py: enroll_learner, record_lesson_progress, calculate_course_progress, get_learner_dashboard с валидацией прав, лимитов квот и защитой от накруток времени.

  4. Полноценное тестовое покрытие (FrappeTestCase/pytest) жизненного цикла зачислений, квот, расчёта процентов, фиксации времени и ролевой изоляции (fail-closed).'
