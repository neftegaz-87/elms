schema: epic-decompose/v1
epic_id: T-A14-elms-admin-org-view-all
plan_id: T-A14-elms-admin-org-view-all
step_id: s01
role: app
next_phase: APP IMPLEMENT
title: Admin organization selector, read-only roster, audit, and mutate-as DENY
level: L2
status: pending
needs_creative: false
visible_ui: yes
surfaces:
  backend: yes
  frontend: yes
  visible_ui: yes
  wire: yes
design_surface: product_ui
wire_complete_required: true

goal: >-
  Дать ELMS Admin и ELMS Operations User серверный выбор любой организации и
  read-only просмотр её существующего roster/export в кабинете, сохранив
  Company Admin только в своей организации. Выбранная org не меняет сессию и
  не открывает submit/import confirmation, B2C acting-as enrollment или invite;
  успешный просмотр фиксируется в ELMS User Activity.

delta:
  - Add a platform-view organization directory contract by extending the existing get_company_access_context response for ELMS Admin/Operations without granting them mutation-as capability.
  - Replace the cabinet free-text organization field with server-provided organization options and a selected read context; keep get_org_roster and export_org_progress as the only roster/read model.
  - Extend the view guard so platform viewer roles can read a selected organization, while add a distinct mutation guard that requires Company Admin membership in that organization.
  - Record actor, selected organization, activity type Organization View, reference organization, and timestamp in the existing ELMS User Activity DocType after an authorized roster view.
  - Close platform viewer mutation paths for B2B import upload/confirmation, B2C enroll_learner acting for another user, and invite_org_user; preserve Company Admin own-org behavior and explicit 403 states.
  - Update Desk cabinet, admission/import, and access surfaces with the server-backed selector, «режим просмотра» copy, no acting-as controls, keyboard-visible states, and scoped ELMS product styling.
  - Add backend, UI, wire, and browser-harness contract tests for all three ACs, audit persistence, no session swap, and leftover mutate-as paths.

as_built:
  - elms/elms/access/api.py exposes get_company_access_context and require_organization_access, but the platform viewer set is not consistently separated from mutation authorization.
  - elms/elms/cabinet/roster.py and desk-cabinet.js already reuse the T-A09 roster/export model, but the admin control is a free-text organization input and there is no Organization View audit event.
  - elms/elms/admission/import_api.py permits platform-admin upload/read resolution, invite_org_user uses the general view guard, and lms/api/__init__.py permits platform roles to call enroll_learner for another user.
  - elms/elms/lms/services/b2b_admission.py already has a Company Admin-only confirmation policy; this slice makes the selected platform-view boundary explicit and regression-tested rather than relying on UI state.
  - ELMS User Activity already stores organization, user, activity_type, timestamp, reference_doctype, reference_name, and IP address and is the existing audit/retention path.

out_of_scope:
  - Impersonation, session User swap, acting-as identity, or synthetic Company Admin sessions.
  - Submit admission, confirm B2B import, B2C enrollment, invite, or any other company mutation from a platform viewer context.
  - Changing Company Admin permissions, organization membership semantics, roster DTO shape, export format, or progress source of truth beyond this ACL boundary.
  - A new organization roster/read model, a new audit DocType, or a parallel activity/event store.
  - Cross-organization Company Admin access, learner self-enrollment, payment provider behavior, 1С, Bitrix, or CRM/ERP roles.

