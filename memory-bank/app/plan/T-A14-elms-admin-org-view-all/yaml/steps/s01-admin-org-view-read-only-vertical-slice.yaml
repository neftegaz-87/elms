checkpoints:
  - id: cp1-org-directory-and-roster
    criterion: Admin/Operations receives server-backed all-org options, opens org X through get_org_roster/export, and Company Admin remains own-org-only.
    verify: ./bin/pytest -q elms/elms/tests/test_admin_org_view.py elms/elms/tests/test_cabinet_roster.py elms/elms/tests/test_company_access.py
  - id: cp2-view-audit-and-no-impersonation
    criterion: Authorized Organization View creates the existing ELMS User Activity event and no session User or role/profile state is swapped.
    verify: >-
      rg -n 'Organization View|ELMS User Activity|frappe\.session\.user|session\.user'
      elms/elms/cabinet/roster.py elms/elms/access/api.py
      elms/elms/lms/doctype/elms_user_activity
  - id: cp3-mutate-deny
    criterion: Platform viewer confirm/import, B2C acting enrollment, and invite-as-company paths return 403 before mutation; Company Admin own-org path remains valid.
    verify: ./bin/pytest -q elms/elms/tests/test_access_invite.py elms/elms/tests/test_admission_import.py elms/elms/tests/test_b2b_batch_quotas.py elms/elms/tests/test_admin_org_view.py
  - id: cp4-read-only-ui
    criterion: Cabinet, admission, and access surfaces expose «режим просмотра», use server organization options, and render no platform mutate-as control.
    verify: ./bin/pytest -q elms/elms/tests/test_cabinet_ui.py elms/elms/tests/test_admission_import_ui.py elms/elms/tests/test_access_ui.py elms/elms/tests/test_workspaces.py
  - id: cp5-syntax-and-wire
    criterion: Python/Desk assets parse and all selected-org, guard, audit, and legacy-path checks pass.
    verify: python3 -m py_compile elms/elms/access/api.py elms/elms/cabinet/roster.py elms/elms/lms/api/__init__.py elms/elms/lms/api/admission.py elms/elms/lms/services/b2b_admission.py elms/elms/admission/import_api.py
  - id: cp6-browser
    criterion: Existing ELMS browser harness can exercise organization selection, read-only roster, empty/error states, and no mutate-as affordance on the local stack.
