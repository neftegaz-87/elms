    vercel-react-view-transitions: The UI is an existing Frappe Desk page with vanilla JavaScript and does not use View Transitions API.
    full-output-enforcement: Acceptance needs focused selector, read-only, roster, and denial states rather than a full unabridged UI dump.
    ui-ux-pro-max: This is an existing product_ui extension using the ELMS/neftegaz visual canon, not a new style encyclopedia or redesign.
