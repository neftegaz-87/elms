    - memory-bank/app/plan/T-A14-elms-admin-org-view-all/md/plan.md:41-70
  user_journey: >-
    ELMS Admin or ELMS Operations User opens the existing cabinet, receives the
    organization list from get_company_access_context, selects org X, and the
    page calls get_org_roster/export_org_progress with X. The server rechecks
    the view capability, records Organization View, and renders the roster with
    «режим просмотра». A platform viewer attempting confirm_admission_import,
    import upload, B2C enrollment for another user, or invite_org_user receives
    403 before mutation. A Company Admin receives only its membership org and a
    foreign-org roster remains denied.
  api:
    organization_context:
      method: elms.access.api.get_company_access_context
      input: optional selected organization for re-authorization
      output: organizations, selected organization, platform_viewer, and read-only capability state
      errors: PermissionError for a Company Admin foreign organization
    roster:
      method: elms.cabinet.api.get_org_roster
      input: organization, optional status_filter, page, page_size
      output: existing OrgRosterDTO rows and organization context, plus audited Organization View
      errors: PermissionError for unauthorized organization; DoesNotExistError for an unknown organization
    export:
      method: elms.cabinet.api.export_org_progress
      input: selected organization and existing status filter
      output: existing server-generated CSV for the authorized organization
      errors: same organization view guard and export contract as T-A09
    mutation_guards:
      methods:
        - elms.lms.api.admission.confirm_admission_import
        - elms.admission.import_api.upload_import
        - elms.lms.api.enroll_learner
        - elms.access.api.invite_org_user
      rule: Platform viewer is read-only; only Company Admin membership in the target organization may mutate-as.
  roles:
    platform_viewer: ELMS Admin and ELMS Operations User may list/read selected organizations; no mutation-as.
    company_admin: ELMS Company Admin may read and mutate only an organization where the current user is an explicit member.
    denied: Guest, ELMS Learner, Company Admin for a foreign organization, and platform viewers on company mutation paths.
  persistence: >-
    Roster and export remain read-only over the T-A09 organization member,
    enrollment, and course-progress sources. View events are inserted into the
    existing ELMS User Activity DocType with user, organization, activity_type,
    reference_doctype/reference_name, IP, and timestamp. No session identity or
    parallel audit/read-model store is persisted.
  security: >-
    require_organization_access is the view boundary and a separate
    require_organization_mutation_access is the mutation boundary. The selected
    organization is always re-authorized server-side. UI selection and hidden
    controls are presentation only.
  ui_contract:
    route: /app/elms-cabinet
    selector: Server-provided organization select; no free-text org input or client-only all-org list.
    required:
      - ELMS Admin and ELMS Operations User see all organizations.
      - Company Admin sees only its own organization and cannot select another.
      - Roster/export show explicit «режим просмотра» for platform viewers.
      - No session swap, invite, submit, confirm, or acting-as control is rendered in the read-only context.
      - Existing focus-visible, aria-live, empty, error, and responsive states remain intact.
    design: Existing ELMS/neftegaz product_ui Desk surface with scoped CSS; no SPA or new brand language.
  done: >-
    AC-001 proves an Admin/Operations actor lists all organizations and reads org
    X through the existing roster/export path with an Organization View audit.
    AC-002 proves confirm_admission_import and the other mutate-as paths return
    403 without writes for a platform viewer. AC-003 proves a Company Admin sees
    only its own org. Static leftover checks prove no session swap, free-text
    directory, client-only ACL, or parallel audit/read model remains.

requirements:
  - get_company_access_context returns all organization options only to platform viewers and membership organizations only to Company Admins.
  - get_org_roster and export_org_progress reuse the existing T-A09 server read model and re-authorize every selected organization.
  - Organization View is recorded only after an authorized view and uses ELMS User Activity as the sole audit SoT.
  - Platform viewer roles cannot upload/confirm admission imports, enroll another user through the B2C manager path, or invite a user into a selected organization.
  - Company Admin mutation paths require explicit membership in the target organization; UI filtering is never the security boundary.
  - The selected organization never changes frappe.session.user, Keycloak identity, User Permission, or role/profile state.
  - Desk labels and controls communicate read-only «режим просмотра» and do not expose platform mutate-as actions.
  - Company Admin own-organization roster behavior and foreign-organization denial remain unchanged.
  - No second roster query, progress source, view audit DocType, or client-side user list is introduced.

