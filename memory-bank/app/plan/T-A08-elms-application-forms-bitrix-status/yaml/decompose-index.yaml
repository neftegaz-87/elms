split_rationale: 'Two independently verifiable acceptance boundaries: (1) form submit
  creates a Bitrix Lead and an Application Link with fail-closed transport; (2) status
  is read from Bitrix as sole SoT with DENY of local master status and Desk/web refresh.
  Backend+www/Desk UI for each boundary stay in the same mixed shard — no separate
  BACK/FRONT/INTEG queues.'
technology_axiom_lock:
- Pydantic JSON submit payload (application_kind individual|legal); FORBIDDEN free-text
  status regex
- Bitrix Lead id + STATUS_ID as SoT; ELMS stores bitrix_id + last_status_snapshot
  only
- Transport only scripts/bitrix/rest_client.py (BITRIX_REST_WEBHOOK_URL); no BITRIX_WEBHOOK_URL
  fallback
- Entity lock P0: crm.lead.add / crm.lead.get for both form kinds (clarify Q11 = lead)
