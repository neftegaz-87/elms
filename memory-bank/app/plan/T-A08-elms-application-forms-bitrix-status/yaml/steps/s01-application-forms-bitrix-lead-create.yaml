status: ready
visible_ui: yes
needs_creative: no
wire_complete_required: true

goal: >-
  Дать физлицу и юрлицу публичные формы в ELMS: валидный submit создаёт Lead в
  Bitrix через rest_client, сохраняет ELMS Application Link с bitrix_id и показывает
  подтверждение с tracking ref; при недоступности Bitrix — явная ошибка без
  локального «успеха».

