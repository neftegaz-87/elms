  - memory-bank/app/plan/T-A08-elms-application-forms-bitrix-status/md/plan.md:98-129
  ac_quotes:
  - "AC-001: Given published course id; When submit valid PII+consent; Then Bitrix lead created; ELMS stores bitrix_id; user sees success with tracking ref."
  - "AC-002: Given legal cooperation payload with courses+INN+consent; When submit; Then Bitrix lead created and Application Link stored for application_kind=legal."
  - "AC-003: Given Bitrix unavailable or BITRIX_REST_WEBHOOK_URL missing; When submit; Then form/API returns explicit error and no successful Application Link is presented."
  bitrix_entity_lock:
    entity: lead
    create_method: crm.lead.add
    rationale: clarify Q11 — ELMS form creates lead; deal path cut from P0
    kinds:
      individual: TITLE/SOURCE mark application_kind=individual + course link
      legal: TITLE/SOURCE mark application_kind=legal + multi course ids + INN
  user_journey: >-
    Guest opens /apply (individual or legal). Fills Pydantic-validated fields and
    consent. Server maps payload to crm.lead.add via rest_client. On Bitrix
    success ELMS inserts Application Link (bitrix_id, bitrix_entity=lead,
    application_kind, course refs) and returns tracking ref. On missing webhook
    or Bitrix error — HTTP/form error, no Link with success flag.
  api:
    submit_application:
      method: elms.applications.api.submit_application
      allow_guest: true
      input: >-
        ApplicationSubmitPayload JSON — application_kind: individual|legal;
        individual: fio, email, phone, course (published), consent;
        legal: company_name, inn, contact fio/email/phone, course_ids[],
        comment?, consent; honeypot field
      output: name (Application Link), bitrix_id, tracking_ref, application_kind
      errors: >-
        ValidationError; BitrixRestError/ConfigurationError → fail-closed
        message (sanitized); Permission/rate-limit errors
    list_published_courses:
      method: elms.applications.api.list_published_courses
      allow_guest: true
      input: optional query
      output: course name/title list for selects
      errors: none critical
  roles:
    guest: submit public forms
    admin_ops: may read created links (list UI in s02)
    denied: no local status write on create path
  persistence: >-
    ELMS Application Link DocType: bitrix_id (Data, req), bitrix_entity
    (Literal lead), application_kind (individual|legal), applicant fields
    snapshot, course Link/Table, consent_at, submit_fingerprint (optional
    anti-dup), last_status_snapshot empty until s02 sync.
    ELMS Application Settings (Single): optional lead field map / source id;
    not a second status SoT.
  done: >-
    Both forms submit through whitelist API create a real Bitrix Lead (mocked
    in unit; live optional), persist Application Link with bitrix_id, show
    success tracking ref; Bitrix/config failure never reports success; rest_client
    is the only transport; www UI wired to real method names.

