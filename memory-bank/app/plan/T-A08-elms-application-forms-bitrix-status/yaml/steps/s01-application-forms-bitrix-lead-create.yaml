as_built:
- scripts/bitrix/rest_client.py — sole REST transport; BITRIX_REST_WEBHOOK_URL fail-closed; no form/lead domain yet.
- elms/elms/www — missing; no public application forms.
- elms/elms/elms_core — Organization/Invite present; no Application Link DocType.
- No ELMS-owned application Workflow status machine to keep (greenfield); enforce against introducing one.

delta:
- Add Application Link + Settings DocTypes and Pydantic submit API.
- Wire crm.lead.add through rest_client; persist bitrix_id; fail-closed on transport errors.
- Add /apply public UI for individual and legal forms calling real whitelist methods.
- Add honeypot/rate-limit and optional idempotent fingerprint; mask PII in logs.

