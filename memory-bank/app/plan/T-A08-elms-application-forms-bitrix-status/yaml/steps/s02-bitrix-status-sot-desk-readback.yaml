as_built:
- After s01: Application Link exists with bitrix_id but no status read-back or Desk list.
- No ELMS application Workflow today — step must not introduce master status Select/Workflow.
- desk-access.js is org/invite only; applications Desk surface is new.

delta:
- Add status.py + get/refresh/list whitelist methods using crm.lead.get.
- Persist snapshot-only fields; Settings status_map; DENY local master writes in DocType/API.
- Wire Desk list + public status page with «статус из Bitrix» and refresh control.
- Kind I: no operator instructions that teach setting Approved in ELMS.

