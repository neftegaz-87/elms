  ac_quotes:
  - "AC-004: Given Bitrix status changed to STAGE_X; When ELMS refresh; Then UI shows STAGE_X label from mapping; stale local snapshot updated."
  - "AC-005: Given Application Link; When PATCH/write local master status; Then ValidationError/Permission denied."
  bitrix_status_lock:
    get_method: crm.lead.get
    sot_field: STATUS_ID
    elms_mirror: last_status_snapshot + last_synced_at + display_label from map
    forbidden: ELMS Workflow State / Select status as master; local write that overrides Bitrix
  user_journey: >-
    Operator opens Desk Application Links list, selects a link, clicks
    «Обновить статус». Server calls crm.lead.get, maps STATUS_ID via Application
    Settings status_map JSON, writes snapshot fields only. Applicant tracking
    page/badge shows label + synced_at. Attempt to set Approved via DocType
    write/API fails closed. Optional inbound webhook updates snapshot only
    (same mapper); never invents local master.
  api:
    get_application_status:
      method: elms.applications.api.get_application_status
      input: name (Application Link) or tracking_ref
      output: bitrix_id, status_code, display_label, last_synced_at, application_kind
      errors: NotFound; BitrixRestError/config → fail-closed (no fake Approved)
    refresh_application_status:
      method: elms.applications.api.refresh_application_status
      input: name
      output: same as get after snapshot update
      errors: same fail-closed
    list_application_links:
      method: elms.applications.api.list_application_links
      input: optional filters kind/status_snapshot
      output: rows for Desk
      errors: PermissionError for non Admin/Operations
    deny_local_status_write:
      surface: ELMS Application Link validate/on_update + any whitelist setter
      behavior: ValidationError/PermissionError if client tries master status field
  roles:
    admin: ELMS Admin — list + refresh
    operations: ELMS Operations — list + refresh
    guest: status by tracking_ref only (read)
    denied: Company Admin write of foreign/local master status; Learner inventing Approved
  persistence: >-
    Application Link gains last_status_snapshot, last_status_code,
    last_synced_at, display_label (derived). No Workflow. Application Settings
    holds status_map JSON (STATUS_ID → label) as single mapping SoT.
    Optional webhook receiver writes snapshot fields only.
  done: >-
    Mocked Bitrix STATUS_ID change appears after refresh; Desk list + badge
    wire real methods; local master status write DENY proven by tests; leftover
    SoT scan finds no ELMS Workflow master; invite deep-link remains out_of_scope.

