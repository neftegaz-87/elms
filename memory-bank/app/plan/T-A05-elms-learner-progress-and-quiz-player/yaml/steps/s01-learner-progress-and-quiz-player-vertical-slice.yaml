as_built:
- path: elms/elms/lms/api.py
  fact: get_lesson_quiz strips correct keys, start_quiz rejects an existing active attempt, submit_quiz grades only on final submit, and get_learner_dashboard is self-only.
- path: elms/elms/lms/doctype/elms_quiz_attempt/elms_quiz_attempt.json
  fact: answers_json and snapshot_json exist, but no persisted answered counters or draft timestamp exist.
- path: elms/elms/public/js/desk-learning.js
  fact: player renders option controls after start and collects answers only in the form until submit; management search is course-grouped and has no learner profile action.
- path: elms/elms/public/css/desk-learning.css
  fact: existing LMS token system has quiz/player styles but no profile/history state contract.
- path: elms/elms/tests/test_lms_core.py
  fact: existing tests cover safe payload, server grading, progress math and cross-user lesson-progress denial.

delta:
- Extend ELMS Quiz Attempt persistence and API to save validated draft answers, resume one active attempt, expose counters and preserve safe grading disclosure.
- Add learner profile/history aggregation from canonical LMS records with permission and self-only enforcement.
- Wire player counter/save/resume/result UI and a management learner profile/history surface to real whitelist calls.
- Add targeted backend/UI/wire contract assertions and preserve T-A02/T-A04 behavior.

deletes:
- path: elms/elms/lms/api.py
  symbol: start_quiz active-attempt rejection as the only resume behavior
  replacement: idempotent active-attempt response with persisted draft and counters
- path: elms/elms/public/js/desk-learning.js
  symbol: client-only final submit path with no draft save/resume or learner profile action
  replacement: save/resume counter and permission-aware learner profile journey

out_of_scope:
- certificates, exam commission protocols, FIS FRDO/EISOT export and manual grading
- full question bank authoring in Course Studio, organization analytics and cohort dashboards
- external LMS, OmniRoute/RAG/assistant integration and duplicate history/progress DocTypes

