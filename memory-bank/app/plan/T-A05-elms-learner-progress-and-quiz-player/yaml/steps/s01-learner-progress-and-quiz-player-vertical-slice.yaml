tdd:
- Add failing backend tests for invalid options, draft save/resume, counters, attempt ownership and profile history permission before implementation.
- Add failing UI contract assertions for answer options, save/resume counter, learner profile/history and explicit error states before implementation.
- Implement DocType/API behavior, then player/profile UI and scoped styles against real Frappe method names.
- Run backend, frontend syntax/contract, wire and live checks; prove no answer-key leakage or UI-only permission path.

verify:
- ./bin/pytest -q elms/elms/tests/test_lms_core.py -k 'quiz or progress or learner_profile or activity'
- ./bin/pytest -q elms/elms/tests/test_learning_ui.py -k 'learning or quiz or progress or profile'
- node --check elms/elms/public/js/desk-learning.js
- python3 -m py_compile elms/elms/lms/api.py
- rg -n "save_quiz_progress|get_learner_profile|answered_questions|history_by_year|Продолжить тест|Введено" elms/elms/lms/api.py elms/elms/public/js/desk-learning.js elms/elms/public/css/desk-learning.css

checkpoints:
- id: cp1
  criterion: Quiz options are validated/sanitized and draft answers/counters persist across resume without duplicate attempts.
  verify: ./bin/pytest -q elms/elms/tests/test_lms_core.py -k 'quiz or attempt or option'
- id: cp2
  criterion: Learner profile/history aggregates canonical sources by year and enforces self/target permissions with no partial denial payload.
  verify: ./bin/pytest -q elms/elms/tests/test_lms_core.py -k 'learner_profile or history or isolation or activity'
- id: cp3
  criterion: Player renders options, save/resume/counters/results and management opens profile/history through real API call-sites.
  verify: ./bin/pytest -q elms/elms/tests/test_learning_ui.py -k 'learning or quiz or progress or profile'
- id: cp4
  criterion: Production JS/Python parse and wire/legacy scans prove the mixed boundary has no final-only or UI-only path.
  verify: node --check elms/elms/public/js/desk-learning.js && python3 -m py_compile elms/elms/lms/api.py && rg -n "save_quiz_progress|get_learner_profile|history_by_year|answered_questions" elms/elms/lms/api.py elms/elms/public/js/desk-learning.js

wire_complete:
  call_sites:
  - "LMS My Courses -> player -> get_lesson_quiz -> start_quiz/resume -> sanitized option cards"
  - "Player option changes/save -> save_quiz_progress -> ELMS Quiz Attempt draft counters"
  - "Player submit -> submit_quiz -> server score/status -> course progress refresh"
  - "Management learner search -> get_learner_profile -> profile/history by year"
  - "Denied target or invalid attempt -> visible typed error; no silent empty success"
  enforce_path: elms/elms/lms/api.py
  dual_path_rg: rg -n "start_quiz|save_quiz_progress|submit_quiz|get_learner_profile|get_learner_dashboard" elms/elms/lms/api.py elms/elms/public/js/desk-learning.js
  instruction_rg: rg -n "correct|answer_key|history_by_year|learner profile|data-action=\\\"learner" elms/elms/lms/api.py elms/elms/public/js/desk-learning.js
  deny_old_proven: true
