goal: >-
  Замкнуть production journey LMS от опубликованного quiz-урока до сохранённой
  возобновляемой попытки и от management поиска слушателя до permission-aware
  профиля с прогрессом и историей обучения по годам.

plan_contract:
  fr_ids: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-006]
  us_ids: [US-001, US-002, US-003, US-004, US-005, US-006]
  nouns:
  - ELMS Quiz
  - ELMS Quiz Question
  - ELMS Quiz Attempt
  - ELMS Course Progress
  - ELMS Lesson Progress
  - ELMS Program Enrollment
  - ELMS User Activity
  - save_quiz_progress
  - get_learner_profile
  - answered/total question counter
  - history_by_year
  - learner profile surface
  layout_paths:
  - /app/elms-learning
  - elms/elms/lms/api.py
  - elms/elms/lms/doctype/elms_quiz_attempt/elms_quiz_attempt.json
  - elms/elms/public/js/desk-learning.js
  - elms/elms/public/css/desk-learning.css
  ac_quotes:
  - "Слушатель видит варианты id/text без correct и может сохранить/возобновить активную попытку."
  - "Карточка слушателя показывает программы, курсы, события и историю по годам только при настроенном праве."
  - "Любой прямой cross-user запрос без права получает typed PermissionError/403 и не partial payload."
  - "Wire путь идёт через реальный Frappe API и сохраняет существующий T-A02 course progress contract."
  plan_jumps:
  - memory-bank/app/plan/T-A05-elms-learner-progress-and-quiz-player/md/plan.md:38-205
  - memory-bank/app/plan/T-A05-elms-learner-progress-and-quiz-player/md/plan.md:210-286
  user_journey: >-
    Learner opens My Courses, enters a published quiz lesson, starts or resumes
    the active attempt, selects options, saves draft, returns later and submits.
    A viewer with configured LMS read permission searches a learner in management,
    opens the profile and sees current courses, programs, events and yearly history.
  api:
    save_quiz_progress:
      method: elms.lms.api.save_quiz_progress
      input: attempt identifier plus JSON answers keyed by snapshot question name
      output: attempt status, sanitized answers, answered_questions, total_questions, percentage, saved_at
      errors: Guest/cross-user 403; missing/closed/expired attempt or invalid option 400/404
    get_learner_profile:
      method: elms.lms.api.get_learner_profile
      input: optional target User name; omitted means current session user
      output: user, summary, current_courses, programs, history_by_year, activity
      errors: explicit missing user 404; unauthorized target 403 with no partial payload
    existing_extensions:
      get_lesson_quiz: sanitized options plus active attempt summary when available
      start_quiz: idempotent resume for existing active attempt
      submit_quiz: optional answers, counters and safe result disclosure
      get_learner_dashboard: quiz summary and last activity without breaking existing keys
  roles:
    self_view: ELMS Learner through own enrollment/progress permissions
    target_view: any role granted read access to the LMS source records plus applicable User Permission
    management_callers: configured role/access only; no hardcoded UI-only role flag
    denied: Guest, learner targeting another user, authenticated user without source read permission
  persistence: >-
    Extend ELMS Quiz Attempt with draft counters/timestamp while retaining
    answers_json and frozen snapshot. Aggregate learner history from existing
    Enrollment, Program Enrollment, Course/Lesson Progress, Quiz Attempt and
    User Activity; do not create a duplicate history/progress DocType.
  ui_contract:
    route: /app/elms-learning
    required: quiz option cards, answered/total counter, save/resume/submit/result states, learner profile/history by year
    empty_error: no enrollments, no quiz, invalid options, no history, denied target, expired/closed attempt
    accessibility: keyboard reachable radio/checkbox options, visible focus/disabled/loading/error states, Russian labels
  done: >-
    Real LMS data flows from published quiz lesson through safe option payload,
    persisted draft/resume and server grading; management can open a permitted
    learner profile with yearly history; all required backend/frontend/wire/live
    checks pass and old final-only/cross-user UI-only paths are absent.

