  outcome: Confirm parsed B2B import into active enrollments with atomic quota and
    boundary enforcement.
  effort_probe:
    independent_outcomes:
    - Company Admin confirms a parsed import or selected rows and receives an explicit
      result report.
    - Quota accounting, course resolution, catalog flags, and organization ownership
      are enforced by the same server transaction.
    - Company cabinet previews remaining seats and presents success or typed row/batch
      errors.
    split_seams: []
  split_rationale: 'The API, enrollment transaction, quota guard, catalog resolver,
    organization guard, cabinet controls, and browser/API checks form one acceptance
    boundary: a confirm cannot be trusted unless all of them are wired together. Splitting
    backend, UI, or policy guards would create an untestable partial confirm contract.
    L3 permits three shards, but no independent seam exists here.'
