schema: epic-decompose/v1
epic_id: T-A12-elms-b2b-batch-quotas
plan_id: T-A12-elms-b2b-batch-quotas
step_id: s01-b2b-admission-vertical
role: app
next_phase: APP IMPLEMENT
title: B2B parsed import confirmation with quota-safe enrollment
goal: >-
  Let a Company Admin confirm a parsed B2B import into quota-safe Active
  enrollments with an auditable, explicit result report.
delta:
  - Add the missing B2B admission confirmation contract on top of T-A11 parsed imports and T-A09 cabinet ownership, including quota, catalog, and org guards.
as_built:
  - T-A11 supplies parsed import rows and T-A09 supplies the company cabinet entry; this shard adds the confirmation transaction and its API/UI checks.
out_of_scope:
  - AI parsing or import normalization
  - B2C payment and payment-provider integration
  - Custom fields epic work
  - Platform admin acting-as submission
  - 1C or Bitrix integration
objective: >-
  Deliver the Company Admin confirm flow from a parsed import preview through
  Active ELMS Enrollment creation, Learner Profile snapshot, seat accounting,
  catalog resolution, organization isolation, audit, and an explicit result
  report in both API and cabinet UI.
surfaces:
  backend: yes
  frontend: yes
  visible_ui: yes
  wire: yes
design_surface: product_ui
plan_contract:
  source: memory-bank/app/plan/T-A12-elms-b2b-batch-quotas/md/plan.md
  level: L3
  ac_ids:
    - AC-001
    - AC-002
    - AC-003
    - AC-004
  ac_quotes:
    - id: AC-001
      quote: >-
        Given parsed import + seats≥N; When confirm N rows; Then N Active
        enrollments; seats_used += N.
    - id: AC-002
      quote: >-
        Given seats < N; When confirm; Then typed error; no over-quota
        enrollments.
    - id: AC-003
      quote: >-
        Given flag can_use_owner_catalog=false; When row targets owner course;
        Then row error.
    - id: AC-004
      quote: >-
        Given other org import id; When confirm as Company Admin; Then 403.
  fr_ids:
    - FR-001
    - FR-002
    - FR-003
    - FR-004
  nfr_ids:
    - NFR-001
    - NFR-002
    - NFR-003
  layout:
    type: vertical_slice
    entrypoint: confirm_admission_import
    contract_boundary: API plus Company cabinet confirm and result report
    persistence: ELMS Enrollment, ELMS Subscription, Learner Profile, audit
requirements:
  - Parsed import status is required; optional row_ids select only rows from that import.
  - Company Admin may confirm only an import owned by the actor organization; platform admin acting-as is denied.
  - Every selected valid row creates or links a Learner, snapshots unified profile data, creates Active enrollment, and records the actor/import/count audit.
  - Subscription selection uses the explicit subscription_id carried by the import; missing subscription_id, no active match, or multiple matching active subscriptions are rejected with typed errors, and unit coverage verifies each case.
  - Confirmation is atomic all-or-none: validate every selected row and quota before writes; any quota, no-match, or ambiguous-row failure rolls back Learner, Enrollment, seats_used, and audit writes, with no enrolled rows returned.
  - Resolve an exact normalized (program, training_kind) pair to one active Course and then one active Batch belonging to that Course; no-match and multiple-match cases return typed row errors, and unit coverage verifies precedence, no-match, and ambiguity alongside can_use_owner_catalog and can_publish_own.
  - The cabinet shows preview data and remaining seats before confirm and renders the explicit success/error report after confirm.
  - PII profile writes use the existing B2C controls; no new external provider or acting-as path is introduced.
