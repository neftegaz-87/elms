  design_groups:
    - D0
  omit_justification:
    fastapi-templates: Frappe whitelist and Document APIs are the backend boundary; no FastAPI route or dependency-injection surface.
    async-python-patterns: The Frappe transaction is synchronous and has no async I/O, concurrent handler, or websocket task.
    sqlalchemy-postgres: Persistence uses Frappe DocTypes and the existing ELMS Subscription/Enrollment contracts, not SQLAlchemy or Alembic.
    supabase-postgres-best-practices: No Supabase or direct Postgres SQL surface is planned.
    websocket-engineer: Confirm is request/response with a persisted report, not realtime fanout or websocket state.
    python-performance-optimization: The shard has no measured hot-path, streaming, or downsampling requirement.
    python-configuration: No new environment or settings surface is introduced.
    python-observability: The plan requires audit records, not a new metrics/health/structured-logging subsystem.
    python-resilience: No external provider, retry, timeout, or circuit-breaker boundary is introduced.
    full-output-enforcement: No full unabridged UI dump is required; browser evidence is limited to the acceptance flow.
    vercel-react-view-transitions: The surface is an existing Frappe Desk page and does not use the View Transitions API.
    ui-ux-pro-max: This is an existing product UI extension using the ELMS/neftegaz visual canon, not a style encyclopedia or new UX system.
  notes:
    - surface=product_ui groups=D0
    - FRONT Core Next/Vercel paths are retained because the APP gate requires the full FRONT union even for a Frappe Desk surface.
    - No session skill is placed in impl or design.
