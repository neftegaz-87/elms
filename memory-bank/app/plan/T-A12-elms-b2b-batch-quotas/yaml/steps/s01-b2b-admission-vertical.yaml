verify:
  - ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
  - python3 -m py_compile elms/elms/lms/api/admission.py elms/elms/lms/api/schemas/admission.py elms/elms/lms/services/b2b_admission.py
  - node --check elms/elms/lms/page/elms-learning/elms-learning.js
