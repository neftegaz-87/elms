checkpoints:
  - id: backend-unit
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
    outcome: API and unit contract covers all four ACs, atomic rollback and quota behavior, deterministic subscription/course resolution, and typed row errors.
  - id: nfr-audit-traceability
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
    outcome: NFR-002 is verified by asserting the persisted audit actor, source import, and confirmed row count for each successful confirmation.
  - id: nfr-pii-traceability
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
    outcome: NFR-003 is verified by asserting Learner Profile writes use the existing B2C PII controls and introduce no external-provider or acting-as path.
  - id: browser-acceptance
    verify: NEFTEGAZ_BROWSER=chromium timeout -k 10s 300s .venv/bin/python scripts/run_browser_qa.py
    outcome: Company cabinet confirms the parsed import and renders the result report.
  - id: syntax
    verify: python3 -m py_compile elms/elms/lms/api/admission.py elms/elms/lms/api/schemas/admission.py elms/elms/lms/services/b2b_admission.py
    outcome: New Python modules compile before integration tests.
  - id: desk-js-syntax
    verify: node --check elms/elms/lms/page/elms-learning/elms-learning.js
    outcome: Company cabinet Desk JS parses.
tdd:
  - RED: Add API/unit tests for parsed-only confirm, Active enrollments, seat delta, typed QuotaExceeded, catalog flag denial, and cross-organization 403.
  - RED: Add browser coverage for preview remaining seats, confirm action, and explicit success/error report.
  - GREEN: Implement the typed JSON confirm payload and server transaction through the canonical enroll_learner path.
  - GREEN: Wire the cabinet controls to the same confirm contract and preserve fail-closed errors.
  - REFACTOR: Keep quota, resolver, organization ownership, audit, and profile snapshot rules in one reusable admission service boundary.
  - REFACTOR: Keep UI as a caller of the server contract; no client-side security or quota authority.
