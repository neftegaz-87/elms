  - T-A11 parsed import contract
  - T-A09 Company cabinet surface
  - Existing ELMS Subscription, Enrollment, Learner Profile, and audit contracts
split:
  independent_outcomes:
    - API and browser confirm of a parsed import with atomic Active enrollments and seat delta.
    - Typed fail-closed quota and course/organization policy errors.
  split_seams: []
  rationale: >-
    Keep this as one mixed vertical slice because the product outcome is only
    valid when parsing state, ownership, mapping, quota, enrollment, audit, and
    cabinet reporting are committed and observed through the same confirm path.
