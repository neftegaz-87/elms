as_built:
- Desk learning management already has .elms-relationship-search-controls without assistant entry.
- ELMS Settings Section is an RBAC-only Single; no Integration Settings Form exists.
- Platform Workspace Integrations is hidden; Settings workspace has access cards only.
- LMS whitelist API lives in elms/elms/lms/api.py; no elms.ai package yet.

delta:
- Add ELMS Integration Settings Single with enabled/base_url/Password key/default_model and Admin write perms.
- Add OmniRoute client, context assembler, get_models/ask whitelist with role gates and fail-closed disabled path.
- Wire assistant button + chat panel into relationship search controls; Workspace Settings link to Integration Settings.
- Deny site_config dual-path and floating FAB; prove LMS unaffected when AI disabled.

