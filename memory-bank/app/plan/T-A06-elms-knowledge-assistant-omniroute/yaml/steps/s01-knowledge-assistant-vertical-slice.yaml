  ac_quotes:
  - "Admin открывает Settings → ELMS Integration Settings и сохраняет enabled/URL/key/default_model."
  - "Кнопка ассистента в .elms-relationship-search-controls, не floating FAB."
  - "ask возвращает answer + sources; unknown model отклоняется до completions."
  - "enabled=0 → явная ошибка ask; LMS пути продолжают работать."
  plan_jumps:
  - memory-bank/app/plan/T-A06-elms-knowledge-assistant-omniroute/md/plan.md:66-210
  - memory-bank/app/plan/T-A06-elms-knowledge-assistant-omniroute/md/plan.md:211-304
  user_journey: >-
    ELMS Admin opens Workspace Settings, opens ELMS Integration Settings Form,
    enables OmniRoute with base URL, API key and default model. Desk staff opens
    learning management, uses the assistant button next to relationship search,
    picks a model, asks about an existing whitelist method or DocType, and sees
    a grounded answer with sources. With integration disabled the assistant fails
    closed while LMS search and enroll keep working.
  api:
    get_models:
      method: elms.ai.api.get_models
      input: none
      output: models list and default_model from Integration Settings + OmniRoute
      errors: disabled/missing config ValidationError; upstream 401 Auth error; Learner PermissionError
    ask:
      method: elms.ai.api.ask
      input: question, optional model, optional bounded history
      output: answer, insufficient_data, sources, model, correlation_id
      errors: disabled/config; unknown model; OmniRoute timeout/status; empty question; PermissionError
  roles:
    settings_write: ELMS Admin, System Manager, Administrator
    chat_call: ELMS Admin, ELMS Operations User, ELMS Methodologist, ELMS Instructor, System Manager, Administrator
    denied: Guest, ELMS Learner
  persistence: >-
    ELMS Integration Settings Single is the sole OmniRoute config SoT (Password
    field for key). No Chat DocType. Context pack is assembled from as-built files
    at runtime (optional short TTL cache).
  ui_contract:
    settings_route: Form for DocType ELMS Integration Settings via Workspace Settings
    assistant_entry: button inside .elms-relationship-search-controls
    required: model select, messages, input, send, error/insufficient states, sources list
    forbidden: floating FAB; Learner-visible assistant entry
  done: >-
    Settings Form is the only product config path; relationship-search assistant
    calls get_models/ask; grounded sources present; disabled path fails closed;
    site_config dual-path and FAB are absent.

