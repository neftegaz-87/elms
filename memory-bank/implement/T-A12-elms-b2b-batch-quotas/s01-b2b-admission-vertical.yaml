checkpoints:
  - id: backend-unit
    criterion: API and unit contract covers parsed-only confirmation, typed quota/catalog/organization errors, deterministic subscription and course resolution, atomic rollback, audit, and profile snapshots.
    status: done
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
  - id: nfr-audit-traceability
    criterion: Successful confirmation persists the actor, source import, and confirmed row count in the audit record.
    status: done
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
  - id: nfr-pii-traceability
    criterion: Learner profile snapshots stay inside the existing admission profile boundary and add no external provider or acting-as path.
    status: done
    verify: ./bin/pytest -q elms/elms/tests/test_b2b_batch_quotas.py
  - id: browser-acceptance
    criterion: Company cabinet previews remaining seats, confirms the parsed import, and renders an explicit result report.
    status: done
    verify: NEFTEGAZ_BROWSER=chromium timeout -k 10s 300s .venv/bin/python scripts/run_browser_qa.py
  - id: syntax
    criterion: New Python admission modules compile.
    status: done
    verify: python3 -m py_compile elms/elms/lms/api/admission.py elms/elms/lms/api/schemas/admission.py elms/elms/lms/services/b2b_admission.py
  - id: desk-js-syntax
    criterion: Company cabinet Desk JS parses.
    status: done
    verify: node --check elms/elms/lms/page/elms-learning/elms-learning.js

