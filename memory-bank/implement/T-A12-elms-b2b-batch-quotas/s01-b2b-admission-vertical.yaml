  instruction_rg: "rg -n 'confirm_admission_import|B2BAdmissionService|enroll_learner' elms/elms/lms/api/admission.py elms/elms/lms/services/b2b_admission.py elms/elms/lms/page/elms-learning/elms-learning.js"
  dual_path_rg: "rg -n 'confirm_admission_import|B2BAdmissionService|enroll_learner' elms/elms/lms/api/admission.py elms/elms/lms/services/b2b_admission.py elms/elms/lms/page/elms-learning/elms-learning.js"
  deny_old_proven: true

