deletes: []

tests:
  - '`PYTHONPATH=elms python3 -m unittest elms.tests.test_sso_config`'
  - '`python3 -c ''import json; d=json.load(open("docker/keycloak/realm-elms.json")); c=next(x for x in d["clients"] if x["clientId"] == "elms-frappe"); i=next(x for x in d["identityProviders"] if x["alias"] == "yandex"); assert c["publicClient"] is False and c["standardFlowEnabled"] is True; assert i["providerId"] == "oidc" and i["firstBrokerLoginFlowAlias"] == "first broker login"''`'
  - '`test "$(rg -n "custom/yandex|yandex_login" elms/elms docker .env.example || true)" = ""`'
  - '`! rg -i ''(client_secret|password)\s*[:=]\s*["0-9a-zA-Z]{16,}'' docker/ elms/ .env.example`'

integration_check:
  - 'The realm import contains client elms-frappe and identityProviders[yandex]; the Yandex application callback is documented as /realms/elms/broker/yandex/endpoint rather than invented as a Frappe callback.'
  - 'KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, and KEYCLOAK_PUBLIC_URL reach the Frappe site_config path; YANDEX_CLIENT_ID and YANDEX_CLIENT_SECRET reach only the Keycloak container.'
  - 'The generated site_config contains keycloak_login and elms_sso_default_roles, never direct Yandex login dictionary.'
  - 'The public Keycloak URL is used for browser authorization; keycloak:8080 remains container-internal only.'

checkpoints:
  - id: cp1
    criterion: 'realm-elms.json contains a confidential elms-frappe client, Yandex broker alias, first-broker-login flow, and local fallback-capable realm settings; the broker callback is an external Yandex application contract, not a fabricated realm JSON field'
    status: done
    verify: >-
      python3 -c 'import json; d=json.load(open("docker/keycloak/realm-elms.json")); c=next(x for x in d["clients"] if x["clientId"] == "elms-frappe"); i=next(x for x in d["identityProviders"] if x["alias"] == "yandex"); assert c["publicClient"] is False and c["standardFlowEnabled"] is True; assert i["providerId"] == "oidc" and i["firstBrokerLoginFlowAlias"] == "first broker login"; assert d["registrationAllowed"] is False'
  - id: cp2
    criterion: 'SSO constants are exported in elms.sso.constants'
    status: done
    verify: 'python3 -c "from elms.sso.constants import KEYCLOAK_PROVIDER_NAME, YANDEX_IDP_ALIAS, KEYCLOAK_LOGIN_CONF_KEY; assert KEYCLOAK_PROVIDER_NAME == \"Keycloak\"; assert YANDEX_IDP_ALIAS == \"yandex\"; assert KEYCLOAK_LOGIN_CONF_KEY == \"keycloak_login\""'
  - id: cp3
    criterion: 'Environment example files contain SSO placeholders without real secrets'
    status: done
    verify: 'grep -q "KEYCLOAK_CLIENT_ID" docker/.env.dev.example && grep -q "YANDEX_CLIENT_ID" docker/.env.dev.example'
  - id: cp4
    criterion: 'Site config helper generates keycloak_login without a direct yandex_login dictionary'
    status: done
    verify: 'python3 -c "import inspect, elms.sso.conf; assert hasattr(elms.sso.conf, \"inject_sso_site_config\")"'
  - id: cp5
    criterion: 'Zero real client secrets are committed in tracked repository files'
    status: done
    verify: >-
      ! rg -i '(client_secret|password)\s*[:=]\s*["0-9a-zA-Z]{16,}' docker/ elms/ .env.example
