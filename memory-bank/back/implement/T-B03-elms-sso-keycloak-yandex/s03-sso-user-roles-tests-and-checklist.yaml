tests:
  - '`PYTHONPATH=elms python3 -m unittest elms.tests.test_sso`'
  - '`test -f docs/sso.md && grep -q "Yandex" docs/sso.md && grep -q "fallback" docs/sso.md`'
  - '`test -f elms/elms/tests/test_sso.py && grep -q "yandex" elms/elms/tests/test_sso.py`'
  - '`test "$(rg -n "custom/yandex|yandex_login" elms/elms docs docker/README.md || true)" = ""`'

integration_check:
  - 'User.after_insert invokes maybe_assign_sso_roles only for the Keycloak social signup path and fails closed when ELMS LMS User or another configured default role is missing.'
  - 'First broker login is documented and tested as JIT creation/linking of the Keycloak realm user and federated Yandex identity, followed by creation of the Frappe User; no SCIM or bulk directory import is added.'
  - 'A selected realm user may receive an explicit local Keycloak password; the Yandex password/token is never copied, and no password is auto-generated for every broker-created user.'
  - 'With Yandex unavailable, a user without a local Keycloak credential fails closed; a user with an explicit credential authenticates through the same elms-frappe client and reaches the existing Frappe User.'
  - 'docs/sso.md and docker/README.md contain the broker callback, host-networking, first-login, local fallback, and outage verification steps.'

checkpoints:
  - id: cp1
    criterion: 'maybe_assign_sso_roles exists, detects Keycloak social signup, and verifies default roles before assignment'
    status: done
    verify: 'python3 -c "import inspect, elms.sso.roles; assert hasattr(elms.sso.roles, \"maybe_assign_sso_roles\"); assert \"frappe.throw\" in inspect.getsource(elms.sso.roles.maybe_assign_sso_roles)"'
  - id: cp2
    criterion: 'hooks.py registers User after_insert for SSO role assignment'
    status: done
    verify: 'grep -q "doc_events" elms/elms/hooks.py && grep -q "maybe_assign_sso_roles" elms/elms/hooks.py'
  - id: cp3
    criterion: 'SSO test module exists with unit and static contract coverage'
    status: done
    verify: 'test -f elms/elms/tests/test_sso.py && grep -q "class TestSSO" elms/elms/tests/test_sso.py'
  - id: cp4
    criterion: 'docs/sso.md and docker/README.md document broker onboarding, local Keycloak fallback, outage branches, and networking details'
    status: done
    verify: 'test -f docs/sso.md && grep -q "Keycloak" docs/sso.md && grep -q "Yandex" docs/sso.md && grep -q "fallback" docs/sso.md'
  - id: cp5
    criterion: 'SSO tests assert no direct Yandex Social Login Key and cover just-in-time broker identity behavior'
    status: done
    verify: 'test -f elms/elms/tests/test_sso.py && grep -q "TestSSO" elms/elms/tests/test_sso.py && grep -q "yandex" elms/elms/tests/test_sso.py'

