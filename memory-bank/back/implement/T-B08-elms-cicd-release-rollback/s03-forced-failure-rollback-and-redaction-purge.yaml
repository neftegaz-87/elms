  - "python3 scripts/infra/check_release_manifest.py --fixture tests/infra/fixtures/release-manifest.json"
  - "if rg -n 'previous|pair|health|rollback|state volumes|never' docs/operations/elms-production.md; then exit 0; else exit 1; fi"
  - "if rg -n -i '(client_secret|handoff_secret|secret_id|unseal|recovery_key|oauth.*cookie|private.?key|docker (volume )?rm|down -v)' scripts/infra/deploy_wrapper.py tests/infra/fixtures/release-manifest.json tests/infra/fixtures/release-rollback-failure.json docs/operations/elms-production.md .github/workflows/production-release.yml; then exit 1; else exit 0; fi"

