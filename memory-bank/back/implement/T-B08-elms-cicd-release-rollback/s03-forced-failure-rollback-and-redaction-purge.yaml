done:
  - Added a deterministic forced-health-failure fixture and integration contracts proving a failed candidate does not replace current.json and a rollback restores the predecessor image pair atomically.
  - Added checks that failure/rollback evidence and the operator runbook contain no credential, OAuth-cookie, private-key, or recovery-value material.
  - Removed the remaining workflow teardown volume-removal command and documented explicit approval, target, digest-pair, failed-health retention, and state-volume boundaries.

