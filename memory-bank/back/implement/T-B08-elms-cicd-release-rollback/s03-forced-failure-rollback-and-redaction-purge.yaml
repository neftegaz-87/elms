deletes:
  - nominal-only rollback confidence without a forced health-failure branch
  - mixed backend/frontend rollback guidance and any state-volume removal path
  - secret-bearing release/rollback evidence and mutable or checkout-build instructions

wire_complete:
  call_sites:
    - fake health failure -> deploy_wrapper subprocess failure -> previous current.json remains unchanged
    - verified predecessor manifest -> rollback wrapper -> complete image pair -> atomic current.json replacement
    - release/rollback fixtures and status output -> redaction tests -> operator runbook boundary
  enforce_path: >-
    The candidate is recorded only after config, pull, wait-for-health, and all internal smoke
    commands pass; a forced failure leaves the verified predecessor current, and rollback can
    only consume a validated release from releases/ as one image/config pair without volume removal.
  dual_path_rg: >-
    if rg -n -i '(client_secret|handoff_secret|secret_id|unseal|recovery_key|oauth.*cookie|private.?key|docker (volume )?rm|down -v|volume removal)'
    scripts/infra/deploy_wrapper.py tests/infra/fixtures/release-manifest.json
    tests/infra/fixtures/release-rollback-failure.json docs/operations/elms-production.md
    .github/workflows/production-release.yml; then exit 1; else exit 0; fi
  instruction_rg: >-
    if rg -n -i 'copy.*password|print.*secret|build on production host|checkout build'
    docs/operations/elms-production.md; then exit 1; else exit 0; fi
  deny_old_proven: true

