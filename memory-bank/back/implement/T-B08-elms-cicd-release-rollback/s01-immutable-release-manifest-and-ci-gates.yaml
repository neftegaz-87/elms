done:
  - The release workflow now runs browser QA against the isolated dev stack before the immutable build/push job can start, and uploads redacted browser evidence.
  - Release manifest validation now requires every image tag to identify the declared commit in addition to validating digest format, smoke status, mutable-tag rejection, and secret redaction.
  - Targeted infrastructure tests cover the workflow gate ordering, valid manifest, mutable/secret rejection, and commit-unbound image tags.

files:
  - .github/workflows/production-release.yml
  - scripts/infra/check_release_manifest.py
  - tests/infra/test_production_contracts.py
  - tests/infra/fixtures/release-manifest.json

deletes:
  - workflow GHCR push path that can run without browser QA and the existing contract/application gates
  - mutable latest/dev/prod-local release identity in the release handoff

wire_complete:
  call_sites:
    - contract job -> frappe-tests job -> Run browser QA step -> build job with needs: [contract, frappe-tests]
    - build job -> check_release_manifest.py -> release-manifest.json artifact upload
    - check_release_manifest.py -> manifest fixture and targeted infrastructure tests
  enforce_path: A failed contract, Frappe/app, or browser QA command returns non-zero before the build job; the validator rejects mutable, malformed, commit-unbound, or secret-bearing release manifests.
  dual_path_rg: >-
    if rg -n -i '(^|[:/])latest($|[^[:alnum:]-])|prod-local|dev-[0-9a-f]' .github/workflows/production-release.yml tests/infra/fixtures/release-manifest.json; then exit 1; else exit 0; fi
  instruction_rg: >-
    if rg -n -i 'copy.*password|print.*secret|docker.*down -v|build on production host' docs/operations/elms-production.md; then exit 1; else exit 0; fi
  deny_old_proven: true

tests:
  - "bin/pytest tests/infra/test_production_contracts.py -k 'release_manifest or release_workflow or browser_qa' -q"
  - "python3 scripts/infra/check_release_manifest.py --fixture tests/infra/fixtures/release-manifest.json"
  - "python3 -m compileall -q scripts/infra/check_release_manifest.py tests/infra/test_production_contracts.py"
  - "rg -n 'frappe-tests|run_browser_qa.py|check_compose_policy.py|check_secret_contract.py|docker/build-push-action' .github/workflows/production-release.yml"
  - "if rg -n -i '(password|secret|token|private.?key|unseal|recovery)' tests/infra/fixtures/release-manifest.json; then exit 1; else exit 0; fi"

integration_check:
