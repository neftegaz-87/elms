deletes:
  - implicit local/development deployment target and default production-root mutation
  - arbitrary compose/env file overrides and incomplete or mutable release-pair recording
  - path-presence-only backup/Vault promotion evidence
  - arbitrary remote shell, Compose flags, and volume-removal release paths

wire_complete:
  call_sites:
    - protected production workflow -> known_hosts-pinned SSH -> named deploy_wrapper.py --root/--target
    - deploy_wrapper.py -> check_release_manifest.validate -> fixed Compose config/pull/up/wait/internal smoke
    - deploy_wrapper.py -> backup_runner.read_success_evidence + exact PASS Vault marker -> atomic releases/current.json
    - rollback command -> verified predecessor manifest -> same complete digest-pinned pair sequence
  enforce_path: >-
    A deploy or rollback without an explicit safe target, approval, valid complete pair,
    matching Compose hash, fresh verified backup, and exact Vault PASS marker exits before
    state-changing Compose commands; current.json is written only after every fixed health
    and internal smoke command succeeds.
  dual_path_rg: >-
    if rg -n -i '(docker (volume )?rm|down -v|bash -c|sh -c|eval )'
    scripts/infra/deploy_wrapper.py .github/workflows/production-release.yml;
    then exit 1; else exit 0; fi
  instruction_rg: >-
    if rg -n -i 'copy.*password|print.*secret|build on production host'
    docs/operations/elms-production.md; then exit 1; else exit 0; fi
  deny_old_proven: true

