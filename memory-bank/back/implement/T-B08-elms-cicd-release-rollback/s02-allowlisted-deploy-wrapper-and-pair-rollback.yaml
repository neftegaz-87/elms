done:
  - The server wrapper now requires explicit deployment root and target values, rejects local/development targets, and permits only the fixed production Compose and env files.
  - Release execution validates the complete ELMS image pair and Compose hash, requires approval plus fresh verified backup and Vault evidence, serializes state changes, and atomically records only a successful health/smoke result.
  - The protected workflow validates safe target/path inputs, pins SSH to supplied known_hosts, and invokes only the named wrapper with no arbitrary Compose or remote shell arguments.
  - Targeted tests cover approval, digest overrides, target guard, workflow handoff, stale/unverified evidence, and volume-removal rejection.

