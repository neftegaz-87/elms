done:
  - Vault operator helpers use the non-secret ELMS_VAULT_OPERATOR_TOKEN contract and expose bootstrap, rotation, revoke, synthetic snapshot, and disposable restore paths without value logging.
  - Vault preflight now covers sealed, unavailable, unauthorized, missing-render, and redacted synthetic states while the live AppRole read uses an explicit token flag.
  - Production Keycloak render and realm no longer contain the legacy local fallback user/password; dev mode is explicit and independent from production Vault delivery.
  - Production guidance is value-free and uses authenticated AppRole/preflight, protected snapshot, rotation, revoke, and disposable restore runbooks.
  - Protected site bootstrap is delegated to the Vault-aware image helper instead of expanding rendered passwords in Compose.

