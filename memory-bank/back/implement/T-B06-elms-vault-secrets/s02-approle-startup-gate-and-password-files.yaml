checkpoints:
  - id: cp1
    criterion: Non-secret production preflight passes in dry-run mode without reading or printing real secret values.
    status: done
    verify: |
      bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run && rg -n 'dry-run|redact|redacted' scripts/infra/vault_preflight.sh
  - id: cp2
    criterion: Missing required metadata, sealed/unavailable Vault, unauthorized AppRole, and incomplete render all return non-zero before promotion.
    status: done
    verify: |
      if bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run --fixture tests/infra/fixtures/vault-missing-path.json; then exit 1; fi
      rg -n 'missing|unauthorized|sealed|unavailable' scripts/infra/vault_preflight.sh
  - id: cp3
    criterion: Compose contains only rendered-file/password-file secret delivery and the contract validator rejects direct values.
    status: done
    verify: |
      python3 scripts/infra/check_secret_contract.py --compose docker/compose.prod.yaml --vault-dir docker/vault && rg -n 'PASSWORD_FILE|vault-runtime|service_healthy' docker/compose.prod.yaml
  - id: cp4
    criterion: Service startup dependencies require the Vault preflight gate and do not fall back to dev synthetic secrets.
    status: done
    verify: |
      rg -n 'vault_preflight|PASSWORD_FILE|vault-runtime|depends_on' docker/compose.prod.yaml scripts/docker-up.sh && rg -n 'condition: service_completed_successfully|condition: service_healthy' docker/compose.prod.yaml

