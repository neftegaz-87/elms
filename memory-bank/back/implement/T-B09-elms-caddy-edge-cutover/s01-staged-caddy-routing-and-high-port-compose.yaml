done:
  - Staged Caddy routing in docker/caddy/Caddyfile.staged now enforces explicit host routing to frontend:8080 and keycloak:8080 with strict 404 fallbacks for unknown hosts, replacing catch-all proxying.
  - Public edge Caddyfile in docker/caddy/Caddyfile defines explicit /healthz endpoints responding 200 for both ELMS and Keycloak hosts without wildcard or fake 200 health responses.
  - Both Caddyfiles document that the review handoff URL is an external first-party review service contract and prevent catch-all proxy drift.
  - Canonical Compose policy confirms zero public port bindings and internal private network isolation for backend, db, redis, keycloak, and vault.
  - Container Caddy stores persistent ACME state in caddy-data and caddy-config named volumes with zero host private key mounts.
  - Targeted infrastructure tests verify staged and edge Caddy routing, port boundaries, volume isolation, and preflight checks.

files:
  - docker/compose.prod.yaml
  - docker/compose.prod.staged.yaml
  - docker/compose.prod.edge.yaml
  - docker/caddy/Caddyfile
  - docker/caddy/Caddyfile.staged
  - tests/infra/test_production_contracts.py

deletes:
  - public port bindings from canonical docker/compose.prod.yaml
  - catch-all reverse proxy definitions that return fake 200 to unknown hosts

wire_complete:
  call_sites:
    - compose.prod.staged.yaml -> caddy container -> Caddyfile.staged -> frontend:8080 and keycloak:8080
    - compose.prod.edge.yaml -> caddy container -> Caddyfile -> frontend:8080 and keycloak:8080
    - compose.prod.yaml -> private internal network and persistent caddy-data / caddy-config volumes
  enforce_path: Staged Caddy binds localhost:18080 without altering host Caddy or public ports; canonical compose publishes zero host ports; explicit /healthz responds 200 while unknown hosts/paths reject fake 200; persistent ACME volumes prevent host private key copying.
  dual_path_rg: >-
    if rg -n -i 'catch-all|catchall' docker/caddy/Caddyfile docker/caddy/Caddyfile.staged; then exit 1; else exit 0; fi
  instruction_rg: >-
    if rg -n -i '(\.key|private_key|privkey\.pem)' docker/compose.prod.yaml docker/compose.prod.edge.yaml; then exit 1; else exit 0; fi
  deny_old_proven: true

tests:
  - "python3 -m pytest tests/infra/test_production_contracts.py -k 'test_edge_preflight_and_wrapper_help or test_caddy_staged_and_edge_routing_contract' -q"
  - "python3 scripts/infra/edge_cutover.py preflight --staged"
  - "python3 scripts/infra/check_compose_policy.py"
  - "rg -n '/healthz|reverse_proxy frontend|reverse_proxy keycloak' docker/caddy/Caddyfile docker/caddy/Caddyfile.staged"
  - "rg -n 'caddy-data|caddy-config' docker/compose.prod.yaml"
  - "! rg -n -i '(\\.key|private_key|privkey\\.pem)' docker/compose.prod.yaml docker/compose.prod.edge.yaml"
  - "rg -n -i 'review|first-party' docker/caddy/Caddyfile docker/caddy/Caddyfile.staged"
  - "! rg -n -i 'catch-all|catchall' docker/caddy/Caddyfile docker/caddy/Caddyfile.staged"
  - "! rg -n -i 'unknown.*200|200.*unknown' docker/caddy/Caddyfile docker/caddy/Caddyfile.staged"

