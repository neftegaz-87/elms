    note: Только Frappe Framework v15 + custom app elms. Vendor ERPNext/LMS/CRM FORBIDDEN.
      Keycloak в compose; Yandex как brokered OIDC Identity Provider внутри Keycloak.
      Frappe использует единственный Social Login Key Keycloak. Роли ELMS Admin /
      ELMS Operations User / ELMS LMS User. FRONT T-F01 зависит от T-B02/T-B03.
  bitrix-rest:
    title: Вызов REST Bitrix24 отдельными скриптами
    note: Входящий вебхук в BITRIX_REST_WEBHOOK_URL. Не секрет доски. План plan/T-B04-bitrix-rest-client/md/plan.md.
      Constitution — md/prompt.md.
  elms-production:
    title: ELMS production (контейнеры, Vault, backup, delivery и edge)
    note: Инфраструктура адаптирована под Frappe + MariaDB + Redis + Keycloak. Сервис
      сверки заявок остаётся отдельным first-party runtime и подключается через ELMS_REVIEW_URL/handoff
      contract; его FastAPI-стек в ELMS не копируется.
