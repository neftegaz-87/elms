checkpoints:
  - id: cp1
    criterion: Canonical Compose policy rejects forbidden build/ports/source mounts and requires service health/resources/security defaults.
    verify: python3 scripts/infra/check_compose_policy.py --file docker/compose.prod.yaml
  - id: cp2
    criterion: Vault secret contract passes with all templates, read-only policy, and fail-closed render markers.
    verify: python3 scripts/infra/check_secret_contract.py --compose docker/compose.prod.yaml --vault-dir docker/vault
  - id: cp3
    criterion: Non-secret production env preflight passes in dry-run mode, does not require real AppRole files, and rejects missing required metadata.
    verify: |
      bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run
      missing_env="$(mktemp)"; sed '/^ELMS_REVIEW_URL=/d' docker/.env.prod.example > "$missing_env"; ! bash scripts/infra/vault_preflight.sh --env-file "$missing_env" --dry-run; rm -f "$missing_env"
  - id: cp4
    criterion: Release identity and ELMS review handoff both fail closed at their boundaries.
    verify: |
      python3 scripts/infra/check_release_manifest.py --fixture tests/infra/fixtures/release-manifest.json
      python3 -m pytest -q elms/elms/tests/test_sso.py -k 'ReviewHandoff'

verify:
