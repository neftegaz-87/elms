schema: epic-decompose/v1
role: back
step_id: s02
plan_id: T-B05-elms-production-container-stack
title: Production policy, Vault render gate, resources/security, and immutable image contract
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Закрепить production boundary исполняемыми проверками: mandatory services обязаны иметь
  health/readiness, restart policy, bounded resources, private networking и no-new-privileges;
  production secrets приходят только из Vault Agent rendered files; release images используют
  commit/release tag вместе с digest и не допускают latest/dev/prod-local. Проверки должны
  завершаться ненулевым кодом при missing production env, неполном Vault render, прямой передаче
  секрета или mutable image identity. ELMS_REVIEW_URL и handoff secret остаются fail-closed
  контрактом внешнего review service; dev synthetic env не становится production fallback.

