as_built:
  - The working tree already contains the validators, Vault templates, and review handoff implementation from an earlier unclosed production integration pass.
  - HEAD production Compose passes DB, Keycloak, and application credentials through direct environment interpolation and has no Vault Agent render gate.
  - HEAD has mutable latest/prod-local defaults and no release manifest validator requiring tag plus digest.
  - HEAD lacks a single policy/secret boundary check for health, resources, security options, internal ports, direct secrets, and placeholder settings.

delta:
  - enforce expected service set, internal private network, no host ports/build/source mounts, restart/security/resource limits, and healthchecks
  - render runtime and database credentials through Vault Agent templates with error_on_missing_key and read-only AppRole policy
  - validate non-secret production env and AppRole file paths without sourcing or printing secret values
  - validate release manifest commit, image refs/tags, digests, compose hash, smoke metadata, and reject latest/secret-like fields
  - keep ELMS_REVIEW_HANDOFF_SECRET out of Compose and repository env files while requiring ELMS_REVIEW_URL in production
  - verify the existing ELMS review boundary rejects invalid URL/secret configuration and consumes signed tickets only once

deletes:
  - direct production secret environment interpolation from the legacy Compose contract
  - mutable latest/dev/prod-local release identity as an accepted production path

wire_complete_required: true
replacement_cleanup:
  replaces: direct secret injection and mutable image defaults
  target: scripts/infra validators, docker/vault templates, and docker/.env.prod.example
  items:
    - direct password/client-secret environment keys
    - mutable image tag acceptance
    - missing Vault render readiness

out_of_scope:
  - generating or committing any real secret, role ID, secret ID, or recovery material
  - live Vault bootstrap/unseal/rotation
  - backup freshness evidence and deployment approval
  - public edge cutover

