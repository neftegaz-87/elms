out_of_scope:
- Modifying production DNS records, external cloud firewall rules, or host network
  interfaces.
- Live stopping of production host Caddy or live acquisition of ports 80/443 during
  CI / unit tests.
- ACME certificate issuance against public Let Encrypt servers in CI/local environments.
- Real production maintenance-window execution; repository provides the disposable
  drill, schema, and operator contract.
- Moving external review service or Neftegaz runtime into ELMS Caddy.
follow_up: []
boundary_notes:
- T-B05 owns the base production and staged Compose stack; T-B06 owns Vault preflight;
  T-B07 owns backup freshness/restore rehearsal; T-B08 owns immutable release manifests
  and deploy wrapper.
- Container Caddy is the sole owner of 80/443 after cutover; all other services (DB,
  Redis, backend, Keycloak, Vault) remain on the private network.
- Predecessor evidence is strictly validated for non-secret status objects, fresh
  mtime (<= 24h), and owner approval.
- Rollback stops container Caddy, restores host Caddy via systemctl, and verifies
  old route availability without data volume loss.
