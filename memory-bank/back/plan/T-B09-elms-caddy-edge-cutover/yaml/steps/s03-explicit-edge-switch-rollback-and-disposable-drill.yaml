  - tests/infra/test_production_contracts.py verifies switch requires approval.
  - docs/operations/elms-production.md outlines edge cutover requirements and status commands.

delta:
  - Enforce that rollback releases container Caddy, executes systemctl start caddy, and verifies host Caddy is active.
  - Add disposable rollback drill contract in tests proving container teardown and restoration sequence without executing privileged systemctl on developer machine.
  - Update docs/operations/elms-production.md with clear maintenance window, rollback budget, and exact switch/rollback commands without secrets.
  - Purge any legacy instruction or script implying automatic CI edge cutover or unapproved port manipulation.

