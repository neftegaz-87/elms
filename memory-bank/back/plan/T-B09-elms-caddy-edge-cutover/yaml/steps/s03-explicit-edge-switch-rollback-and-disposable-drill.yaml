  fr_ids:
    - FR-002
    - FR-005
  nouns:
    - explicit switch
    - explicit rollback
    - approved flag
    - execute flag
    - container port release
    - systemctl start caddy
    - systemctl is-active
    - old route verification
    - disposable rollback drill
    - maintenance window
    - rollback budget
    - operator runbook
  layout_paths:
    - scripts/infra/edge_cutover.py
    - tests/infra/test_production_contracts.py
    - docs/operations/elms-production.md
  ac_quotes:
    - 'FR-002: public switch requires fresh predecessor evidence, owner approval and serialized lock.'
    - 'FR-005: rollback releases container ports, restores host Caddy and verifies old route.'
    - 'Done when: Missing predecessor evidence or approval exits before changing host Caddy; forced failure restores old edge and proves it.'
  plan_jumps:
    - memory-bank/back/plan/T-B09-elms-caddy-edge-cutover/md/plan.md:23-27
