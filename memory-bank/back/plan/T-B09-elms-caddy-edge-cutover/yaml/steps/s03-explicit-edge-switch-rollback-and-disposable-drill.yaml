plan_id: T-B09-elms-caddy-edge-cutover
title: Explicit edge switch, systemd rollback restoration, and disposable drill contract
next_phase: BACK IMPLEMENT
needs_creative: 'no'

goal: |
  Обеспечить доказанный reversible switch & rollback механизм: switch и rollback требуют явных флагов
  --approved --execute, rollback останавливает контейнерный Caddy, освобождает публичные порты,
  восстанавливает host Caddy через systemd (systemctl start caddy) и проверяет прежний route.
  Disposable rollback drill доказывает поведение на failure path без вмешательства в живые DNS/firewall/Caddy,
  а документация фиксирует maintenance window и rollback budget с полной зачисткой устаревших путей.

