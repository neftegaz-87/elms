  ac_quotes:
    - 'FR-001: scripts/bitrix/call.py <method> [--params <json-object>] читает только BITRIX_REST_WEBHOOK_URL, делает POST {url}{method}.json и при успехе печатает исходное JSON-тело в stdout.'
    - 'FR-002: Если в JSON есть непустое поле error, скрипт печатает error и error_description в stderr и завершается с кодом 1. Успешный stdout при этом пуст.'
    - 'FR-003: Нет переменной, пустое значение, не-https, путь не вида /rest/<цифры>/<код>/ — код 2, HTTP нет. Переменная BITRIX_WEBHOOK_URL не читается.'
    - 'FR-008: Для метода batch локально отклоняются пакет больше 50 команд и команда, чьё значение начинается с batch. Код 2, текст с ERROR_BATCH_LENGTH_EXCEEDED или ERROR_BATCH_METHOD_NOT_ALLOWED.'
    - 'AC-1: call.py user.current с валидным URL печатает JSON портала и выходит с кодом 0.'
    - 'AC-2: Тело с error даёт код 1, stderr содержит код ошибки, stdout пуст.'
    - 'AC-3: Нет BITRIX_REST_WEBHOOK_URL — код 2, даже если BITRIX_WEBHOOK_URL задан, и HTTP не вызывается.'
    - 'AC-6: batch длиннее 50 или с вложенным batch не уходит в сеть.'
