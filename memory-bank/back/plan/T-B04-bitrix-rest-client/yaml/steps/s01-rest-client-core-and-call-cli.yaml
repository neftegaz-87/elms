plan_id: T-B04-bitrix-rest-client
title: 'Webhook transport, pydantic boundary, and call.py CLI'
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать единый транспорт и Pydantic-модели валидации границы в scripts/bitrix/rest_client.py
  (WebhookEndpoint, CallArgs, RestEnvelope, post_json), CLI scripts/bitrix/call.py с кодами выхода 0/1/2,
  и модульные тесты в tests/bitrix/test_rest_client.py с подставленным HTTP opener. Скрипт читает исключительно
  BITRIX_REST_WEBHOOK_URL, никогда не читает BITRIX_WEBHOOK_URL доски, скрывает секрет в ошибках, локально
  валидирует имя метода, JSON аргументов и batch-лимиты (<=50 команд, запрет вложенности).

