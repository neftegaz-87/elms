  - 'implement scripts/bitrix/rest_client.py with WebhookEndpoint, CallArgs, RestEnvelope, post_json, and BitrixRestError'
  - 'implement scripts/bitrix/call.py CLI entrypoint with main(argv, env, opener=None) supporting standard exit codes 0/1/2'
  - 'enforce pydantic validations on BITRIX_REST_WEBHOOK_URL: https scheme only, path /rest/<digits>/<code>/, never fallback to BITRIX_WEBHOOK_URL'
  - 'enforce method name lowercase dot-separated format and batch limits (<= 50 commands, no nested batch)'
  - 'hide secret token from exception messages, str/repr outputs, and stderr'
  - 'create tests/bitrix/test_rest_client.py implementing test classes CallSuccessTest, CallBitrixErrorTest, MissingWebhookTest, BadWebhookUrlTest, BadArgsTest, BatchGuardTest, and TransportFailureTest'

