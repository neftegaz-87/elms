checkpoints:
  - id: cp1
    criterion: 'rest_client.py defines WebhookEndpoint, CallArgs, RestEnvelope, and post_json'
    verify: 'python3 -c "import scripts.bitrix.rest_client as rc; assert hasattr(rc, \"WebhookEndpoint\") and hasattr(rc, \"CallArgs\") and hasattr(rc, \"post_json\")"'
  - id: cp2
    criterion: 'call.py provides main entrypoint with exit codes 0, 1, 2'
    verify: 'python3 -c "import scripts.bitrix.call as call; assert hasattr(call, \"main\")"'
  - id: cp3
    criterion: 'Zero secrets committed or exposed in error messages'
    verify: '! rg -i "https://[a-zA-Z0-9.-]+/rest/[0-9]+/[a-zA-Z0-9]{16,}" scripts/ tests/'
  - id: cp4
    criterion: 'Core unit test suite passes via python3 -m unittest'
    verify: 'timeout -k 10s 300s python3 -m unittest tests.bitrix.test_rest_client.CallSuccessTest tests.bitrix.test_rest_client.CallBitrixErrorTest tests.bitrix.test_rest_client.MissingWebhookTest tests.bitrix.test_rest_client.BadWebhookUrlTest tests.bitrix.test_rest_client.BadArgsTest tests.bitrix.test_rest_client.BatchGuardTest tests.bitrix.test_rest_client.TransportFailureTest'

