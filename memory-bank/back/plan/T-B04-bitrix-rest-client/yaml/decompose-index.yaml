- id: AC--1
  step: s01
  description: No second REST integration entrypoint created
- id: AC--2
  step: s01
  description: No fallback to BITRIX_WEBHOOK_URL if new variable is empty
- id: AC--3
  step: s01
  description: Invalid URL and malformed JSON fail before request without mock fallback
- id: AC--4
  step: s01
  description: Board remains on its own key; epic does not modify or wrap board code
- id: AC--5
  step: s01
  description: No HTML or regex parsing of error messages; structured JSON envelopes
