- id: SC-003
  step: s03
  description: Operator can create webhook following documentation file without opening
    plan
- id: AC-1
  step: s01
  description: call.py user.current with valid URL prints portal JSON and exits with
    code 0
- id: AC-2
  step: s01
  description: Response body with error yields code 1, stderr contains error code,
    stdout is empty
- id: AC-3
  step: s01
  description: Missing BITRIX_REST_WEBHOOK_URL gives code 2 even if BITRIX_WEBHOOK_URL
    is set, and no HTTP call is made
- id: AC-4
  step: s02
  description: 'scope.py --full sends {"full": true}'
- id: AC-5
  step: s03
  description: Documentation and .env.example name BITRIX_REST_WEBHOOK_URL and forbid
    board key reuse
- id: AC-6
  step: s01
  description: batch longer than 50 or with nested batch is rejected locally without
