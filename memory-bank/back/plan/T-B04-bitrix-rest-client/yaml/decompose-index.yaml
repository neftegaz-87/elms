requirements_coverage:
- id: FR-001
  step: s01
  description: scripts/bitrix/call.py reads BITRIX_REST_WEBHOOK_URL, performs POST
    {url}{method}.json and prints raw JSON on success
- id: FR-002
  step: s01
  description: If response has error field, script prints error and error_description
    to stderr and exits with code 1
- id: FR-003
  step: s01
  description: Missing env var, empty value, non-https, or path not /rest/<digits>/<code>/
    exits with code 2 without HTTP call; BITRIX_WEBHOOK_URL is not read
- id: FR-004
  step: s02
  description: 'scripts/bitrix/scope.py calls scope method with {} by default or {"full":
    true} with --full'
- id: FR-005
  step: s03
  description: docs/bitrix-incoming-webhook.md in Russian explains webhook creation,
    scopes, and env configuration
- id: FR-006
  step: s01
  description: Method name validated as lowercase segments separated by dots (e.g.
    user.current); invalid name gives exit code 2 before HTTP
- id: FR-007
  step: s01
  description: --params must be a JSON object; array, string, empty or invalid JSON
    gives exit code 2 before HTTP
- id: FR-008
  step: s01
  description: Local guard on batch method rejects batches > 50 or nested batch commands
    with code 2 and limit error code
- id: FR-009
  step: s03
  description: .env.example includes empty placeholder BITRIX_REST_WEBHOOK_URL and
    notes it is not the board webhook
- id: US-001
  step: s01
  description: Operator calls portal REST method and sees JSON response on stdout
    with exit 0, or error on stderr with exit 1
- id: US-002
  step: s02
  description: Operator inspects webhook permissions and portal scope list via scope.py
    and scope.py --full
- id: US-003
  step: s03
  description: Operator follows instructions to create incoming webhook and configure
    URL in environment without touching board key
- id: SC-001
  step: s01
  description: Successful call prints portal JSON body and exits with code 0
- id: SC-002
  step: s01
  description: Portal error and misconfiguration do not masquerade as success (exit
