schema: epic-decompose/v1
role: back
step_id: s02
plan_id: T-B06-elms-vault-secrets
title: AppRole render gate and fail-closed database/application delivery
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Подключить authenticated AppRole/Vault Agent render к MariaDB, Keycloak PostgreSQL,
  Frappe, Keycloak и promotion entrypoints. Sealed/unavailable/unauthorized/missing-key
  состояния обязаны завершать preflight ненулевым кодом; прямые production secrets и
  root-token fallback больше не должны запускать сервисы.

plan_contract:
  fr_ids:
    - FR-003
    - FR-004
  nouns:
    - scripts/infra/vault_preflight.sh
    - scripts/infra/check_secret_contract.py
    - docker/vault/agent.hcl
    - docker/vault/runtime.env.tpl
    - docker/vault/keycloak.env.tpl
    - docker/vault/db-password.tpl
    - docker/vault/keycloak-db-password.tpl
    - docker/compose.prod.yaml
    - "*_PASSWORD_FILE"
    - AppRole
    - fail-closed application promotion
    - Frappe bootstrap
    - Keycloak admin
    - Keycloak client
    - Keycloak DB
    - Yandex broker
    - review handoff
    - exact production env preflight contract
    - docker/.env.prod
  layout_paths:
    - scripts/infra/vault_preflight.sh
    - scripts/infra/check_secret_contract.py
    - docker/compose.prod.yaml
    - docker/.env.prod.example
    - docker/.env.prod
    - docker/vault/agent.hcl
    - docker/vault/runtime.env.tpl
    - docker/vault/keycloak.env.tpl
    - docker/vault/db-password.tpl
    - docker/vault/keycloak-db-password.tpl
  ac_quotes:
    - 'FR-003: Agent renders protected env/file volume; MariaDB/PostgreSQL use *_PASSWORD_FILE where supported.'
    - 'FR-004: sealed/unavailable/unauthorized/missing key → non-zero preflight and no application promotion.'
  plan_jumps:
    - memory-bank/back/plan/T-B06-elms-vault-secrets/md/plan.md#implementation-slices
    - memory-bank/back/plan/T-B06-elms-vault-secrets/md/plan.md#verification
    - memory-bank/back/plan/T-B06-elms-vault-secrets/md/prompt.md#done-when

context:
  consumes:
    - s01 private Vault service, policy, templates, and protected render volume
    - T-B05 production Compose service graph and health boundaries
  produces:
    - non-secret Vault preflight and startup promotion gate
    - password-file delivery for MariaDB and Keycloak PostgreSQL
    - runtime env render delivery for Frappe, Keycloak, review, and Yandex contracts
  plan_refs:
    - md/plan.md#implementation-slices
    - md/plan.md#verification
    - md/prompt.md#done-when
  files:
    - scripts/infra/vault_preflight.sh
    - scripts/infra/check_secret_contract.py
    - docker/compose.prod.yaml
    - docker/.env.prod.example
    - docker/vault/agent.hcl
    - docker/vault/runtime.env.tpl
    - docker/vault/keycloak.env.tpl
    - docker/vault/db-password.tpl
    - docker/vault/keycloak-db-password.tpl
    - scripts/docker-up.sh

as_built:
  - Existing production startup can reach service entrypoints without proving an authenticated, complete Vault render.
  - Existing Compose contract exposes direct credential interpolation instead of only rendered files/password-file variables.
  - No single non-secret preflight rejects sealed, unavailable, unauthorized, or missing-key Vault state before promotion.

delta:
  - Require root-owned AppRole role-id/secret-id files outside the repository and never source or print their contents; enforce this in scripts/infra/vault_preflight.sh.
  - Make scripts/infra/check_secret_contract.py and scripts/infra/vault_preflight.sh validate non-secret metadata, render markers, authorization, and required paths with non-zero failures.
  - Wire docker/compose.prod.yaml and docker/.env.prod.example to MariaDB and Keycloak PostgreSQL *_PASSWORD_FILE values and protected render-volume delivery.
  - Render the Frappe and Keycloak contracts through docker/vault/agent.hcl, docker/vault/runtime.env.tpl, docker/vault/keycloak.env.tpl, docker/vault/db-password.tpl, and docker/vault/keycloak-db-password.tpl.
  - Make scripts/docker-up.sh application promotion depend on preflight and remove direct production secret interpolation and root-token paths.
  - Delete direct DB_PASSWORD/KEYCLOAK_DB_PASSWORD/KEYCLOAK_CLIENT_SECRET production environment interpolation, startable application promotion when Vault is sealed, unavailable, unauthorized, or incomplete, root-token runtime injection into ELMS services, and production fallback from Vault render to local/dev synthetic values.

deletes:
  - direct DB_PASSWORD/KEYCLOAK_DB_PASSWORD/KEYCLOAK_CLIENT_SECRET production environment interpolation
  - startable application promotion when Vault is sealed, unavailable, unauthorized, or incomplete
  - root-token runtime injection into ELMS services
  - production fallback from Vault render to local/dev synthetic values

wire_complete_required: true

sunset_scope:
  required: true
  boundary_id: elms-production-startup-secrets
  new_sot: scripts/infra/vault_preflight.sh
  allow_read:
    - scripts/infra/vault_preflight.sh
    - scripts/infra/check_secret_contract.py
    - docker/compose.prod.yaml
    - docker/vault/**
    - scripts/docker-up.sh
  kind_hint:
    - A
    - B
    - C

out_of_scope:
  - Real role-id, secret-id, recovery keys, and production KV values; operator custody is required before live bootstrap.
  - External backup freshness and restore scheduling, which belongs to T-B07.
  - Registry/deployment approval and rollback, which belongs to T-B08.

skills:
  code_surface: infra
  impl:
    - .agents/skills/tdd/SKILL.md
    - .agents/skills/python-testing-patterns/SKILL.md
    - .agents/skills/modern-python/SKILL.md
    - .agents/skills/python-anti-patterns/SKILL.md
    - .agents/skills/python-configuration/SKILL.md
    - .agents/skills/python-observability/SKILL.md
    - .agents/skills/python-resilience/SKILL.md
  devops:
    - .agents/skills/docker-compose/SKILL.md
    - .agents/skills/docker-management/SKILL.md

checkpoints:
  - id: cp1
    criterion: Non-secret production preflight passes in dry-run mode without reading or printing real secret values.
    verify: bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run && rg -n 'dry-run|redact' scripts/infra/vault_preflight.sh
  - id: cp2
    criterion: Missing required metadata, sealed/unavailable Vault, unauthorized AppRole, and incomplete render all return non-zero before promotion.
    verify: bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run --fixture tests/infra/fixtures/vault-missing-path.json && rg -n 'missing|unauthorized|sealed' scripts/infra/vault_preflight.sh
  - id: cp3
    criterion: Compose contains only rendered-file/password-file secret delivery and the contract validator rejects direct values.
    verify: python3 scripts/infra/check_secret_contract.py --compose docker/compose.prod.yaml --vault-dir docker/vault && rg -n 'PASSWORD_FILE|vault-render' docker/compose.prod.yaml
  - id: cp4
    criterion: Service startup dependencies require the Vault preflight gate and do not fall back to dev synthetic secrets.
    verify: 'rg -n "vault_preflight|PASSWORD_FILE|vault-render|depends_on" docker/compose.prod.yaml scripts/docker-up.sh && rg -n "condition: service_completed_successfully" docker/compose.prod.yaml'

verify:
  - bash scripts/infra/vault_preflight.sh --env-file docker/.env.prod.example --dry-run
  - python3 scripts/infra/check_secret_contract.py --compose docker/compose.prod.yaml --vault-dir docker/vault
  - rg -n 'vault_preflight|PASSWORD_FILE|vault-render|depends_on' docker/compose.prod.yaml scripts/docker-up.sh
  - rg -n -i 'Frappe|Keycloak.*(admin|client|DB)|Yandex broker|review handoff|production env|docker/\.env\.prod|preflight' scripts/infra/vault_preflight.sh scripts/infra/check_secret_contract.py docker/compose.prod.yaml docker/.env.prod.example docker/.env.prod

tdd:
  - test_vault_preflight_fail_closed
  - test_password_file_delivery
