plan_id: T-B03-elms-sso-keycloak-yandex
title: 'Keycloak realm client JSON, environment templates, and site_config injection'
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Настроить клиент elms-frappe и Yandex OIDC broker в docker/keycloak/realm-elms.json (confidential,
  точные Frappe и Keycloak broker redirect URI contracts), добавить SSO-переменные окружения в
  docker/.env.dev.example /
  .env.example, определить канонические константы SSO в elms/elms/sso/constants.py, и реализовать инжекцию
  только keycloak_login и elms_sso_default_roles в site_config. Yandex credentials должны попадать только
  в Keycloak container; локальная Keycloak password authentication остаётся доступной для явно provisioned
  fallback users, без хранения секретов в git.

