delta:
  - 'define client elms-frappe with client_secret placeholder, Frappe callback redirect URIs, and Yandex broker callback contract in docker/keycloak/realm-elms.json'
  - 'add SSO environment templates (KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, KEYCLOAK_PUBLIC_URL, YANDEX_CLIENT_ID, YANDEX_CLIENT_SECRET, ELMS_SSO_DEFAULT_ROLES) to docker/.env.dev.example and .env.example'
  - 'create elms/elms/sso/__init__.py and elms/elms/sso/constants.py defining canonical SSO provider identifiers, default URLs, and site_config key names'
  - 'implement elms/elms/sso/conf.py helper to inject only keycloak_login and default roles into site_config without committing secrets'
  - 'update docker/compose.dev.yaml to propagate Keycloak client credentials to Frappe and Yandex broker credentials only to Keycloak'
  - 'add targeted configuration tests covering the one-provider boundary and secret hygiene'

