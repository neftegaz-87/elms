  - '.env.example exists with Bitrix24 and Plane keys without SSO env configuration'
  - 'docker/.env.dev.example contains Keycloak/Yandex placeholders but not the complete public-URL/default-role contract'
  - 'docker/compose.dev.yaml has configurator and create-site services without complete SSO site_config keys and broker credential contract'
