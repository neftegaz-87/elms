  - 'configure exact Frappe redirect URL /api/method/frappe.integrations.oauth2_logins.login_via_keycloak; do not configure custom/yandex'
  - 'enforce conf gating: set enable_social_login=1 only when frappe.conf contains keycloak_login client_id and client_secret'
  - 'support sign_ups configuration (Allow in dev, Deny supported for prod-like hardening)'
  - 'replace legacy setup_keycloak_social_login in install.py with ensure_social_login_keys() call in after_install and after_migrate'
