plan_id: T-B03-elms-sso-keycloak-yandex
title: 'Keycloak-only Social Login Key, Yandex broker boundary, and migration hooks'
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать функцию ensure_social_login_keys() в elms/elms/sso/ensure.py только для Frappe-facing провайдера Keycloak,
  обеспечивающую идемпотентное создание/обновление единственного Social Login Key, точный login_via_keycloak redirect,
  гвардирование enable_social_login только при наличии keycloak_login в frappe.conf, обработку sign_ups (Allow/Deny),
  и подключить её к after_install/after_migrate с удалением устаревшего стаба. Yandex не должен появляться как Frappe
  Social Login Key: его Identity Provider и broker callback принадлежат Keycloak и проверяются отдельным negative path.

