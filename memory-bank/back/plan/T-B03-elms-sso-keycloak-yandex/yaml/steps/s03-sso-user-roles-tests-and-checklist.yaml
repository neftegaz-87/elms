goal: |
  Реализовать fail-closed назначение ролей по умолчанию (Desk User, ELMS LMS User) при создании нового Frappe User
  после Keycloak brokered first login через хук doc_events User after_insert в elms/elms/sso/roles.py с проверкой
  Keycloak social link/email. Зафиксировать just-in-time создание realm user + federated Yandex link, явно описать
  per-user local Keycloak password fallback при недоступности Yandex, разработать юнит/static/manual тесты и обновить
  docs/sso.md и docker/README.md без обещания bulk/SCIM provisioning.

