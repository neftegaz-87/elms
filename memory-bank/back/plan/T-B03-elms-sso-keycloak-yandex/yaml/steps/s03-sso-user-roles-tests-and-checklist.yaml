  - 'create comprehensive unit and static test suite in elms/elms/tests/test_sso.py covering one-provider boundary, conf gating, broker/JIT contract, fail-closed role assignment, fallback behavior, and secret hygiene'
  - 'document manual broker onboarding, Keycloak fallback credentials, Yandex outage behavior, and host networking in docs/sso.md and docker/README.md'

