    criterion: "modules.txt contains Core, Operations, LMS and hooks.py defines elms"
    verify: "python3 -c 'lines = [l.strip() for l in open(\"elms/elms/modules.txt\") if l.strip()]; assert lines == [\"Core\", \"Operations\", \"LMS\"]'"
  - id: cp3
    criterion: "elms pyproject.toml exists and hooks.py has required metadata"
    verify: "grep -q 'app_name = \"elms\"' elms/elms/hooks.py && grep -q 'name = \"elms\"' elms/pyproject.toml"

