checkpoints:
  - id: cp1
    criterion: "DocPerm matrix configured for all three section DocTypes"
    verify: "python3 -c 'import json; erp=json.load(open(\"elms/elms/operations/doctype/elms_operations_section/elms_operations_section.json\")); assert any(p.get(\"role\") == \"ELMS Operations User\" for p in erp.get(\"permissions\", []))'"
  - id: cp2
    criterion: "RBAC matrix tests verify positive, cross-role negative, and guest boundaries"
    verify: "grep -q 'test_admin_has_read_write_all_sections' elms/elms/tests/test_roles_rbac.py && grep -q 'test_guest_denied_all_sections' elms/elms/tests/test_roles_rbac.py"
  - id: cp3
    criterion: "Role taxonomy and DocPerm matrix documented in modules.md"
    verify: "grep -q 'ELMS Admin' memory-bank/product/modules.md && grep -q 'ELMS Operations User' memory-bank/product/modules.md && grep -q 'ELMS LMS User' memory-bank/product/modules.md"

