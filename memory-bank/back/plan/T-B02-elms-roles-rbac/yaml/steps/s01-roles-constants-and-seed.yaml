checkpoints:
  - id: cp1
    criterion: "Role name constants defined and exported"
    verify: "python3 -c 'from elms.install import ELMS_ADMIN_ROLE, ELMS_OPERATIONS_USER_ROLE, ELMS_LMS_USER_ROLE; assert ELMS_ADMIN_ROLE == \"ELMS Admin\"; assert ELMS_OPERATIONS_USER_ROLE == \"ELMS Operations User\"; assert ELMS_LMS_USER_ROLE == \"ELMS LMS User\"'"
  - id: cp2
    criterion: "ensure_roles function creates roles fail-closed and throws on failure"
    verify: "python3 -c 'import inspect, elms.install; assert hasattr(elms.install, \"ensure_roles\"); assert \"frappe.throw\" in inspect.getsource(elms.install.ensure_roles)'"
  - id: cp3
    criterion: "hooks.py registers after_install and after_migrate hooks"
    verify: "grep -q 'after_install = \"elms.install.after_install\"' elms/elms/hooks.py && grep -q 'after_migrate = \"elms.install.after_migrate\"' elms/elms/hooks.py"
  - id: cp4
    criterion: "seed tests pass green validating role creation and idempotency"
    verify: "python3 -c 'import elms.tests.test_roles_rbac; print(\"tests module ready\")'"

verify:
