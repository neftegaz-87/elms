checkpoints:
  - id: cp1
    criterion: "modules.txt aligns module naming and defines Core, Operations, LMS"
    verify: "python3 -c 'lines = [l.strip() for l in open(\"elms/elms/modules.txt\") if l.strip()]; assert lines == [\"Core\", \"Operations\", \"LMS\"]'"
  - id: cp2
    criterion: "ELMS Operations Section DocType exists and is Single in module Operations"
    verify: "python3 -c 'import json; d=json.load(open(\"elms/elms/operations/doctype/elms_operations_section/elms_operations_section.json\")); assert d[\"issingle\"] == 1 and d[\"module\"] == \"Operations\"'"
  - id: cp3
    criterion: "ELMS LMS Section DocType exists and is Single in module LMS"
    verify: "python3 -c 'import json; d=json.load(open(\"elms/elms/lms/doctype/elms_lms_section/elms_lms_section.json\")); assert d[\"issingle\"] == 1 and d[\"module\"] == \"LMS\"'"
  - id: cp4
    criterion: "ELMS Settings Section DocType exists and is Single in module Core"
    verify: "python3 -c 'import json; d=json.load(open(\"elms/elms/core/doctype/elms_settings_section/elms_settings_section.json\")); assert d[\"issingle\"] == 1 and d[\"module\"] == \"Core\"'"

verify:
  - "python3 -c 'import json; [json.load(open(f)) for f in [\"elms/elms/operations/doctype/elms_operations_section/elms_operations_section.json\", \"elms/elms/lms/doctype/elms_lms_section/elms_lms_section.json\", \"elms/elms/core/doctype/elms_settings_section/elms_settings_section.json\"]]'"
