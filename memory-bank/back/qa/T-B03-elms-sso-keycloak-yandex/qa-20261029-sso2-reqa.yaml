- ensure_social_login_keys is idempotent and creates or updates one Keycloak Social Login Key without duplicate records (AC-1, FR-003, FR-006, SC-001)
- The only Frappe OAuth redirect is login_via_keycloak; Yandex broker termination remains in Keycloak (AC-2, FR-003, FR-004, FR-010, US-001, US-002, SC-001)
