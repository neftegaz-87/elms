- Manual setup checklist, outage branches, and host networking requirements have concrete outcomes and curl commands (AC-8, FR-008, FR-009, TM-002, TM-006, TM-009)
ac_minus:
- No committed plaintext client_secret values or default passwords in tracked runtime configuration (AC--1, TM-008, US-004)
