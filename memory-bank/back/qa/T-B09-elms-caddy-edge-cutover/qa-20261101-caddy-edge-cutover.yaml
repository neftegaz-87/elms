ac_minus:
  - Live stopping of production host Caddy or live acquisition of ports 80/443 during tests or outside scheduled maintenance window.
  - Modifying production DNS records, external cloud firewall rules, or host network interfaces.
  - Live ACME certificate issuance against public Let's Encrypt servers in CI/local environments.
  - Copying host private TLS keys into container filesystems or repository.
  - Automatic edge cutover execution from CI pipelines.

section_011:
  - "T-B05 owns the base production and staged Compose stack; T-B06 owns Vault preflight; T-B07 owns backup freshness/restore rehearsal; T-B08 owns release manifests and deploy wrapper."
  - Container Caddy is the sole owner of 80/443 after cutover; all internal services remain on the private network.
  - Rollback stops container Caddy, restores host Caddy via systemctl start caddy, and checks systemctl is-active without deleting data volumes.

