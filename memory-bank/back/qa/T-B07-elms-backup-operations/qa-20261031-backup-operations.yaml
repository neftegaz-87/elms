ac_plus:
  - "FR-001: encrypted client-side off-host repository (restic/S3-compatible) with state manifest."
  - "FR-002: last-success age ≤24h, upload/checksum verification and retention."
  - "FR-003: restore-preflight rejects active production volumes and requires disposable target."
  - "FR-004: capacity hard block at configured threshold; no prune/delete/volume removal."
  - "FR-005: logs/manifests redact PII, OAuth and Vault recovery material."
  - "Done when: Failed/stale/unverifiable backup blocks production promotion, and restore never writes active volumes by default."

ac_minus:
  - "Out: Destructive cleanup, automatic Docker prune, firewall/Caddy changes and active production restore."

section_011:
  - "Review service state not duplicated: its backup contract belongs to its repository; ELMS preserves only handoff/config contract."
  - "Production activation remains blocked until external repository, credentials, operations owner and target capacity are provided."

