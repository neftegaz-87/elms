<section class="elms-b2b-admission" data-b2b-admission>
	<h2>Подтверждение заявки организации</h2>
	<p class="text-muted">Проверьте разобранные строки и доступные места перед зачислением.</p>
	<div class="form-group">
		<label for="b2b-admission-import">Импорт</label>
		<input id="b2b-admission-import" class="form-control" data-admission-import placeholder="ID разобранного импорта" />
	</div>
	<div class="b2b-admission-preview" data-admission-preview aria-live="polite"></div>
	<div class="form-footer">
		<button class="btn btn-default" type="button" data-admission-preview-action>Показать предварительный просмотр</button>
		<button class="btn btn-primary" type="button" data-admission-confirm disabled>Подтвердить зачисление</button>
	</div>
	<div class="b2b-admission-result" data-admission-result aria-live="polite"></div>
</section>
